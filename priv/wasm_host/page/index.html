<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting the app</title>
<!-- The page of beam.com INPUT -o DIR --target wasm32 (DIR/page/): the app
     runs in the browser, in BEAM compiled to WebAssembly. The files of this
     directory are the root of the site. The page finds its base path from
     its URL, so the same files work at /REPO/ of GitHub Pages, at / of a
     custom domain, and on localhost. -->
<style>
  :root { --bg: #f6f4f1; --text: #1f1a17; --muted: #756c65; --accent: #a23cd0; --error: #c0262d; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #171412; --text: #efe9e4; --muted: #a2978f; --accent: #c98bf0; --error: #ff7b7f; }
  }
  :root[data-theme="dark"] { --bg: #171412; --text: #efe9e4; --muted: #a2978f; --accent: #c98bf0; --error: #ff7b7f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #boot { max-width: 40rem; margin: 0 auto; padding: 15vh 16px 0; }
  h1 { font: 700 2rem/1.1 ui-monospace, Menlo, Consolas, monospace; margin: 0 0 8px; overflow-wrap: anywhere; }
  #status { color: var(--muted); min-height: 1.5em; }
  #status.err { color: var(--error); }
  progress { width: 100%; height: 6px; margin: 12px 0; accent-color: var(--accent); }
  p.small { color: var(--muted); font-size: 0.875rem; }
  a { color: var(--accent); }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
  body.running #boot { display: none; }
  body.running iframe { display: block; }
</style>
</head>
<body>
<div id="boot">
  <h1 id="name">The app</h1>
  <p id="status">Starting…</p>
  <progress id="bar"></progress>
  <p class="small">This app runs in this page, in BEAM compiled to WebAssembly by
    <a href="https://github.com/sntran/BEAM.com">beam.com</a>. No server runs its code. Its data
    stays in the memory of this browser, and goes when the last tab of this site closes.</p>
</div>
<iframe id="app" title="The app" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<script type="module">
  // The start of the page (main.js). A site that runs a native app.com
  // gives the options of start() here: { app: './app.com' }.
  import { start } from './main.js';
  start();
</script>
</body>
</html>
