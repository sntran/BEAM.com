<p>A query of only <code>nifs+=</code> or <code>nifs=</code> from a program, as <code>curl</code>, when <code>9-url</code> or <code>10-url-only</code> has no file to give: <code>503</code> with <code>Retry-After: 15</code>. <code>12-build</code> started the build in the <code>cat</code> of 9 or 10. A refused build gets 422 from <code>18-url-mark</code> or <code>19-url-only-mark</code>, which come first.</p>
