<p>A query of a build from a program, as <code>curl</code>, when the file is not ready: <code>503</code> with <code>Retry-After: 15</code>. <code>curl --retry</code> asks again until the file is ready. <code>27-query-build</code> started the build. It has no check of its own: when a check of <code>28-query</code> or <code>32-query-refused</code> fails for a moment, the client asks again.</p>
