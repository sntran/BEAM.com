# Windows on ARM64: the step libc of scripts/steps.sh builds the libc of
# Cosmopolitan for aarch64 with the Windows layer, and the loader
# ape-arm64.exe, in build/cosmo-libc (about 2 minutes). This action gets
# that directory from the cache. When the cache does not have it, the
# action installs the tools that the step needs to build the loader.
#
# The job Build of build.yml saves the cache. Use this action after the
# checkout and before the build.
name: The libc for Windows on ARM64
description: >-
  Restores build/cosmo-libc from the cache, or installs the tools that
  the step libc needs.
outputs:
  cache-hit:
    description: "true when the cache has the directory"
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-primary-key:
    description: The key of the cache
    value: ${{ steps.cache.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - name: The key of the libc for Windows on ARM64
      shell: sh
      run: sh scripts/steps.sh cache_keys | grep '^LIBC_INPUTS=' >> "$GITHUB_ENV"
    - name: Cache the libc for Windows on ARM64
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: build/cosmo-libc
        key: cosmo-libc-${{ env.LIBC_INPUTS }}
    - name: Install clang, lld-link and llvm-dlltool
      if: steps.cache.outputs.cache-hit != 'true'
      shell: sh
      run: |
        for tool in clang lld-link llvm-dlltool; do
          command -v "$tool" > /dev/null || need=1
        done
        if [ -n "${need:-}" ]; then
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld llvm
        fi
