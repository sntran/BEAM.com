name: Build and test BEAM.com

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  OTP_VERSION: "29.1.1"
  COSMOCC_VERSION: "4.0.2"
  OPENSSL_VERSION: "4.0.2"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Build, sqlite: "0", out: beam.com }
          # The SQLite probe (see docs/ROADMAP.md).
          - { name: Build with SQLite, sqlite: "1", out: beam-sqlite.com }
    env:
      SQLITE: ${{ matrix.sqlite }}
      OUT: ${{ github.workspace }}/build/${{ matrix.out }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache cosmocc
        uses: actions/cache@v6
        with:
          path: build/cosmocc
          key: cosmocc-${{ env.COSMOCC_VERSION }}

      - name: Download cosmocc
        run: ./build.sh toolchain

      - name: Cache OpenSSL
        uses: actions/cache@v6
        with:
          path: build/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-cosmocc-${{ env.COSMOCC_VERSION }}

      - name: Register the APE loader
        # Lets the kernel run APE files (the OTP build runs the tools it
        # builds). WINE and other MZ handlers on the runner are disabled.
        run: |
          sudo cp build/cosmocc/bin/ape-x86_64.elf /usr/bin/ape
          sudo sh -c 'echo -1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c 'echo 1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"
          sudo sh -c "echo ':APE-jart:M::jartsr::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"

      - name: Build
        run: ./build.sh openssl otp configure sqlite wasm make release multicall bundle

      - name: Upload ${{ matrix.out }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.out }}
          path: build/${{ matrix.out }}
          if-no-files-found: error

      - uses: actions/setup-go@v7
        if: matrix.sqlite == '0'
        with:
          go-version: stable
          cache: false

      - name: Build the WASI example in Go
        if: matrix.sqlite == '0'
        run: |
          cd examples/wasm/hello_go
          GOOS=wasip1 GOARCH=wasm go build -o ../../../build/hello_go.wasm .

      - name: Upload the WASI example
        if: matrix.sqlite == '0'
        uses: actions/upload-artifact@v7
        with:
          name: hello_go.wasm
          path: build/hello_go.wasm
          if-no-files-found: error

      - name: Upload the APE loader
        if: matrix.sqlite == '0'
        # NetBSD and OpenBSD cannot run APE files through sh.
        uses: actions/upload-artifact@v7
        with:
          name: ape-loader
          path: build/cosmocc/bin/ape-x86_64.elf
          if-no-files-found: error

      - name: Test
        timeout-minutes: 5
        run: BEAM_COM_VERBOSE=1 timeout 120 ./build.sh test

      - name: Unit tests
        if: matrix.out == 'beam.com'
        timeout-minutes: 10
        run: ./build.sh unit

      - name: Trace a failed test
        if: failure()
        timeout-minutes: 5
        run: |
          sudo apt-get install -y strace >/dev/null || true
          BEAM_COM_VERBOSE=1 timeout 60 strace -f -tt -s 200 -o build/strace.txt "$OUT" one two || true
          ps -ef | grep -v grep | grep -i beam || true
          tail -n 80 build/strace.txt || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.out }}
          path: |
            build/otp/erts/config.log
            build/otp/config.log
            build/otp/make/*/otp.mk
            build/strace.txt
          if-no-files-found: ignore

  example-release:
    name: Add a rebar3 release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: beam.com

      # A normal Erlang/OTP and rebar3, as a user has them.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: "3"

      - name: Build the example releases and add them to beam.com
        run: |
          for app in greeter crypto_check tls_check; do
            (cd examples/$app && rebar3 release)
            cp beam.com $app.com
            (cd examples/$app/_build/default/rel/$app &&
             find releases lib -type f | sort &&
             zip -r ../../../../../../$app.com releases lib)
          done

      - name: Upload the example releases
        uses: actions/upload-artifact@v7
        with:
          name: examples
          path: |
            greeter.com
            crypto_check.com
            tls_check.com
          if-no-files-found: error

  test:
    name: Run on ${{ matrix.name }}
    needs: [build, example-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-latest }
          - { name: Linux aarch64, os: ubuntu-24.04-arm }
          - { name: macOS arm64, os: macos-latest }
          - { name: macOS x86_64, os: macos-15-intel }
          - { name: Windows x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: bin
          merge-multiple: true

      - name: Run (Unix)
        if: runner.os != 'Windows'
        run: tests/run.sh bin

      - name: Run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tests/run.ps1 bin

  test-bsd:
    name: Run on ${{ matrix.name }}
    needs: [build, example-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: FreeBSD, vm: freebsd }
          - { name: NetBSD, vm: netbsd }
          # Cosmopolitan supports OpenBSD 7.3 or earlier.
          - { name: OpenBSD 7.3, vm: openbsd }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: bin
          merge-multiple: true

      - name: Run on FreeBSD
        if: matrix.vm == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          run: sh tests/run.sh bin

      - name: Run on NetBSD
        if: matrix.vm == 'netbsd'
        uses: vmactions/netbsd-vm@v1
        with:
          run: |
            echo "== Through sh (known to fail: NUL bytes in the APE header)"
            LIMIT=30 sh tests/run.sh bin || true
            echo "== Through the APE loader"
            # Where Cosmopolitan's execve() looks for the loader, for the
            # helper programs that beam.com starts (it executes itself).
            cp bin/ape-x86_64.elf "$HOME/.ape-1.10"
            chmod +x "$HOME/.ape-1.10"
            RUNNER=bin/ape-x86_64.elf sh tests/run.sh bin

      - name: Run on OpenBSD
        if: matrix.vm == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.3"
          run: |
            echo "== Through sh (known to fail: NUL bytes in the APE header)"
            LIMIT=30 sh tests/run.sh bin || true
            echo "== Through the APE loader"
            # Where Cosmopolitan's execve() looks for the loader, for the
            # helper programs that beam.com starts (it executes itself).
            cp bin/ape-x86_64.elf "$HOME/.ape-1.10"
            chmod +x "$HOME/.ape-1.10"
            RUNNER=bin/ape-x86_64.elf sh tests/run.sh bin
