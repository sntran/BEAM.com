name: Build and test BEAM.com

# One run for each change: a pull request runs CI for its branch, and a
# push runs it only on main (after a merge). A change of the docs only
# (Markdown files, docs/, the issue forms) starts no run. Run the
# workflow by hand (workflow_dispatch) to test a branch without a pull
# request. A tag vX.Y.Z starts a run that publishes the release, and so
# does a run by hand on main with the input release (docs/BUILDING.md).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE*"
  workflow_dispatch:
    inputs:
      release:
        description: >-
          To publish a release of main: its version, as in
          src/beam_com/beam_com.app.src (for example 0.1.0-rc.4). The run
          makes the tag. Empty: build and test the branch.
        required: false
        default: ""

# A new push to a pull request stops the run of its older commit. Each
# commit of main has a group of its own: in one group, a new run replaces
# a run that waits to start, so with the ref as the group a merge could
# stop the run of the merge before it. Each merge is tested, and a
# release of a commit can reuse the run of its push (the job reuse).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (inputs.release && format('release-{0}', inputs.release)) || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The token of a job can read the repository. Only the jobs that publish
# (edge and release) can write, and each one says so.
permissions:
  contents: read

env:
  OTP_VERSION: "29.1.1"
  COSMOCC_VERSION: "4.0.2"
  OPENSSL_VERSION: "4.0.3"
  EMSDK_VERSION: "6.0.10"

# The Linux jobs name their image (ubuntu-26.04), not ubuntu-latest: that
# label moves to a new Ubuntu on a date of GitHub (26.04 from 2026-10-19),
# and a named image does not change under a release candidate.
jobs:
  # A tag on a commit of main (or a run by hand with the input release):
  # the run of that push to main already built and tested the commit. This job waits for that run, and when it
  # passed, it gives its id: then this run builds and tests nothing, and
  # the release job takes the files of that run. With no such run, or one
  # that did not pass, this run builds and tests the commit.
  #
  # The job runs for each event, and it does not fail: for a run that is
  # not for a release, it gives no id at once. A job that a job of its needs
  # skipped (also through other jobs) does not run, so a skip of this job
  # stops all the tests.
  reuse:
    name: Find a tested run of this commit
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ inputs.release }}
    steps:
      - id: find
        run: |
          case $GITHUB_EVENT_NAME:$GITHUB_REF:${RELEASE:+release} in
            push:refs/tags/v*:) ;;
            workflow_dispatch:refs/heads/main:release) ;;
            *) echo "not a run for a release: this run builds and tests the commit"; exit 0 ;;
          esac
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?event=push&branch=main&head_sha=$GITHUB_SHA"
          # 100 tries, 30 s apart: the job ends before its timeout, and an
          # error of the API gives no id.
          for try in $(seq 100); do
            state=$(gh api "$runs" --jq '[.workflow_runs[] | "\(.id) \(.status) \(.conclusion)"] | first // ""') || state=""
            echo "the push to main of $GITHUB_SHA: ${state:-no run}"
            case $state in
              *" completed success") echo "run=${state%% *}" >> "$GITHUB_OUTPUT"; break ;;
              *" completed "*|"") break ;;
            esac
            sleep 30
          done

  build:
    name: ${{ matrix.name }}
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run == '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # beam.com has the JIT: one fat file with the x86 and the arm
          # backend. beam-emu.com has the interpreter.
          - { name: Build, jit: "1", out: beam.com }
          - { name: Build the interpreter, jit: "0", out: beam-emu.com }
    env:
      JIT: ${{ matrix.jit || '1' }}
      CC: cosmocc
      AR: cosmoar
      OUT: ${{ github.workspace }}/build/${{ matrix.out }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache cosmocc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/cosmocc
          # "checked": the cache of a download with its SHA-256 checked.
          key: cosmocc-${{ env.COSMOCC_VERSION }}-checked

      - name: Download cosmocc
        # The GNU make of the host gets cosmocc. Then the make of cosmocc
        # runs the build (the Makefile).
        run: make toolchain

      - name: Cache OpenSSL
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-cosmocc-${{ env.COSMOCC_VERSION }}-cosmocc

      - name: Register the APE loader
        # Lets the kernel run APE files (the OTP build runs the tools it
        # builds). WINE and other MZ handlers on the runner are disabled.
        run: |
          sudo cp build/cosmocc/bin/ape-x86_64.elf /usr/bin/ape
          sudo sh -c 'echo -1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c 'echo 1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"
          sudo sh -c "echo ':APE-jart:M::jartsr::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"

      # The WebAssembly runtime of --target wasm32 (the step wasm_runtime):
      # Emscripten, and OpenSSL built with it.
      - name: Cache emsdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-checked

      - name: Cache OpenSSL for WebAssembly
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/wasm/openssl
          key: wasm-openssl-${{ env.OPENSSL_VERSION }}-emsdk-${{ env.EMSDK_VERSION }}

      # The WebAssembly runtime (the step wasm_runtime, about 4 minutes).
      # The step keeps it only when the SHA-256 of its inputs is the one
      # in build/wasm-runtime/inputs, else it builds it again. The job unit
      # restores it with the same key.
      - name: Cache the WebAssembly runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/wasm-runtime
          key: wasm-runtime-${{ env.OTP_VERSION }}-emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('wasm/erts/**', 'c_src/erts_wasm/**', 'c_src/wasm/**', 'patches/otp/**', 'patches/wamr/**', 'scripts/steps.sh') }}

      - name: Build
        run: build/cosmocc/bin/make

      - name: Upload ${{ matrix.out }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.out }}
          path: build/${{ matrix.out }}
          if-no-files-found: error

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: matrix.out == 'beam.com'
        with:
          go-version: stable
          cache: false

      - name: Build the WASI example in Go
        if: matrix.out == 'beam.com'
        run: |
          cd tests/programs/hello_go
          GOOS=wasip1 GOARCH=wasm go build -o ../../../build/hello_go.wasm .

      - name: Upload the WASI example
        if: matrix.out == 'beam.com'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hello_go.wasm
          path: build/hello_go.wasm
          if-no-files-found: error

      - name: Upload the APE loader
        if: matrix.out == 'beam.com'
        # NetBSD and OpenBSD cannot run APE files through sh.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ape-loader
          path: build/cosmocc/bin/ape-x86_64.elf
          if-no-files-found: error

      - name: Test
        timeout-minutes: 5
        run: BEAM_COM_VERBOSE=1 timeout 120 build/cosmocc/bin/make test

      # The file formats of the output and of a program that it built
      # (tests/check_format.sh): ZIP, PE, ELF and Mach-O. The Mach-O check
      # needs llvm-objdump. check_format.sh finds the one of an LLVM of the
      # image (/usr/lib/llvm-*/bin), so the step installs llvm only when
      # the image has none, with time limits: when the Ubuntu archives did
      # not answer, apt-get update waited until the limit of the step.
      - name: Check the file formats
        timeout-minutes: 10
        run: |
          command -v llvm-objdump >/dev/null || ls /usr/lib/llvm-*/bin/llvm-objdump >/dev/null 2>&1 ||
            { sudo timeout 120 apt-get update -q >/dev/null && sudo timeout 240 apt-get install -y -q llvm >/dev/null; }
          tests/check_format.sh "$OUT" build/hashsum.com

      - name: Trace a failed test
        if: failure()
        timeout-minutes: 5
        run: |
          sudo apt-get install -y strace >/dev/null || true
          BEAM_COM_VERBOSE=1 timeout 60 strace -f -tt -s 200 -o build/strace.txt "$OUT" one two || true
          ps -ef | grep -v grep | grep -i beam || true
          tail -n 80 build/strace.txt || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-logs-${{ matrix.out }}
          path: |
            build/otp/erts/config.log
            build/otp/config.log
            build/otp/make/*/otp.mk
            build/strace.txt
          if-no-files-found: ignore

  # The unit tests (the step unit) on the beam.com of the job build, in
  # their own job: the jobs that need the build do not wait for them.
  unit:
    name: Unit tests
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      OUT: ${{ github.workspace }}/build/beam.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: beam.com
          path: build

      # assimilate of cosmocc, for the tests of tests/check_format.sh.
      - name: Cache cosmocc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/cosmocc
          key: cosmocc-${{ env.COSMOCC_VERSION }}-checked
      - name: Download cosmocc
        run: make toolchain

      # The tests start beam.com (an APE file) from Erlang.
      - name: Register the APE loader
        run: |
          chmod +x "$OUT"
          sudo cp build/cosmocc/bin/ape-x86_64.elf /usr/bin/ape
          sudo sh -c 'echo -1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c 'echo 1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"
          sudo sh -c "echo ':APE-jart:M::jartsr::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"

      # The runtime of the job build, for the differential test
      # (tests/wasm_diff_test.exs). The job build saved it under this key.
      - name: Restore the WebAssembly runtime
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/wasm-runtime
          key: wasm-runtime-${{ env.OTP_VERSION }}-emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('wasm/erts/**', 'c_src/erts_wasm/**', 'c_src/wasm/**', 'patches/otp/**', 'patches/wamr/**', 'scripts/steps.sh') }}
          fail-on-cache-miss: true

      # The differential test runs beam.wasm in Node.js, and needs JSPI
      # (Node.js 25 or later).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "26"

      # The test of the Elixir patch of the Mix lock runs in a user and
      # network namespace (tests/elixir_patches_test.exs). Ubuntu (24.04
      # and later) blocks unprivileged user namespaces through AppArmor.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # scripts/steps.sh, not make: this job has no stamps of the build.
      - name: Unit tests
        timeout-minutes: 10
        env:
          BEAM_COM_NETNS: "1"
        run: scripts/steps.sh unit

  # The models of the protocols (specs/ and lib/beam_com/protocol) with
  # TLC: mix beam_com.tlc. It needs no build of beam.com.
  models:
    name: Check the models
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run == '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      TLA2TOOLS_JAR: ${{ github.workspace }}/tla2tools.jar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: "1.20.4"
      # tla2tools.jar v1.7.4 is the pinned stable release. v1.8.0 is a
      # pre-release that the project publishes again each night, so its
      # jar and its checksum change (docs/TESTING.md).
      - name: Install tla2tools.jar
        run: |
          curl -fsSL -o "$TLA2TOOLS_JAR" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $TLA2TOOLS_JAR" | sha256sum -c -
          java -version
      - name: Check the models with TLC
        run: |
          mix deps.get
          mix beam_com.tlc

  example-release:
    name: Add a rebar3 release
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: beam.com

      # A normal Erlang/OTP and rebar3, as a user has them.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: "3"

      - name: Build the example releases and add them to beam.com
        run: |
          for src in examples/greeter tests/programs/crypto_check tests/programs/tls_check; do
            app=$(basename "$src")
            (cd "$src" && rebar3 release)
            cp beam.com "$app.com"
            (cd "$src/_build/default/rel/$app" &&
             find releases lib -type f | sort &&
             zip -r "$GITHUB_WORKSPACE/$app.com" releases lib)
          done

      - name: Upload the example releases
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: examples
          path: |
            greeter.com
            crypto_check.com
            tls_check.com
          if-no-files-found: error

  # The static site of --page (DIR with app.com, docs/WORKERS.md): the
  # workflow for the apps of users (pages-app.yml) builds two examples with
  # the beam.com of this run, and does not publish them.
  pages-app:
    name: Build the site of ${{ matrix.name }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: phoenix_demo, path: examples/phoenix_demo }
          - { name: worker, path: examples/worker }
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages-app.yml
    with:
      path: ${{ matrix.path }}
      deploy: false
      artifact: beam.com
      name: site-${{ matrix.name }}

  # The sites in Chromium, at /repo/ (a project site of GitHub Pages), at /
  # (a custom domain), and at /app/ (a repository with the name "app").
  page:
    name: Run the sites in a web page
    needs: pages-app
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: sites
          pattern: site-*

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "26"

      # Chrome of the runner (137 or later has JSPI).
      - name: Check the sites in Chromium
        run: |
          for d in sites/*/; do tar -xf "$d/artifact.tar" -C "$d"; done
          npm install --prefix wasm --no-audit --no-fund
          node tests/page/check.mjs sites/site-phoenix_demo --base /repo/ --phoenix-demo --tabs
          node tests/page/check.mjs sites/site-phoenix_demo --phoenix-demo
          node tests/page/check.mjs sites/site-phoenix_demo --base /app/ --phoenix-demo
          node tests/page/check.mjs sites/site-worker --base /repo/

  # One file, natively and in the WebAssembly runtime: native app.com files
  # with their edge part (.wasm/), of examples/hashsum.erl and of the Mix
  # release directory of examples/phoenix_demo. Each one runs natively, and
  # then in Node.js (tests/host/boot_app_com.mjs) with the runtime of a
  # --target wasm32 directory of the same beam.com.
  one-file:
    name: Run one file natively and at the edge
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: beam.com
          path: bin

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "26"

      # Mix runs mix.com as a program: an ELF copy of beam.com
      # (--assimilate) for it. No escript is in PATH: mix.com puts its own
      # (the cache of BEAM.com) there for rebar3, as for npx beam.com in
      # the build of Workers Builds. The builds of app.com use the APE
      # file: a copy of an ELF file is not an APE file. The APE file starts
      # itself again (inet_gethost), so it must be executable.
      - name: Make the tools of Mix programs of the runner
        run: |
          chmod +x bin/beam.com
          mkdir -p tools
          cp bin/beam.com tools/beam.com
          sh tools/beam.com --assimilate
          chmod +x tools/beam.com
          ln -sf "$PWD/tools/beam.com" tools/mix.com
          echo "$PWD/tools" >> "$GITHUB_PATH"

      - name: A program of one file
        run: |
          sh bin/beam.com examples/hashsum.erl -o hashsum.com | tee build.txt
          grep -q 'edge: [0-9]* files' build.txt
          sh ./hashsum.com abc | grep '^ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad  abc$'
          sh bin/beam.com examples/hashsum.erl -o "$RUNNER_TEMP/wasm32" --target wasm32 > /dev/null
          node tests/host/boot_app_com.mjs "$RUNNER_TEMP/wasm32" hashsum.com --expect 'usage: hashsum TEXT'
          # The tools of NIF libraries in WebAssembly: not flags of erl.
          sh bin/beam.com --nif-include < /dev/null | grep -q 'nif-include-'
          sh bin/beam.com --nif-modules hashsum.com "$RUNNER_TEMP/nifs" < /dev/null | grep -q '(0 NIF libraries'
          grep -q 'export default {};' "$RUNNER_TEMP/nifs/nifs.js"

      # The npm package of this beam.com (package.json, and runtime/ of
      # scripts/npm.sh), as a user installs it: npx beam.com with a download
      # from a local server in place of the GitHub release, and hashsum.com
      # with the module beam.com.
      - name: The npm package
        run: |
          scripts/npm.sh bin/beam.com "$RUNNER_TEMP/wasm32"
          npm pack --pack-destination "$RUNNER_TEMP"
          # The command of the step "Publish the npm package" of the
          # release, with --dry-run: a path that does not start with "./"
          # is a GitHub repository (user/repo) for npm.
          vsn=$(node -p 'require("./package.json").version')
          cp "$RUNNER_TEMP/beam.com-$vsn.tgz" bin/
          npm publish "./bin/beam.com-$vsn.tgz" --dry-run --access public --tag next
          rm "bin/beam.com-$vsn.tgz"
          mkdir -p "$RUNNER_TEMP/app/files"
          cp hashsum.com "$RUNNER_TEMP/app/"
          cp bin/beam.com "$RUNNER_TEMP/app/files/"
          cd "$RUNNER_TEMP/app"
          echo '{"type": "module"}' > package.json
          npm install --no-audit --no-fund "$RUNNER_TEMP"/beam.com-*.tgz
          python3 -m http.server 18556 --bind 127.0.0.1 --directory files > server.log 2>&1 &
          server=$!
          for i in $(seq 1 100); do curl -fs -o /dev/null -I http://127.0.0.1:18556/beam.com && break; sleep 0.1; done
          export BEAM_COM_CACHE="$RUNNER_TEMP/cache" BEAM_COM_DOWNLOAD=http://127.0.0.1:18556
          npx beam.com --version 2>&1 | tee version.txt
          grep -q '^beam.com: downloading http://127.0.0.1:18556/beam.com' version.txt
          # The second run reads the cache.
          kill "$server"
          npx beam.com --version | head -n 1 | grep '^beam.com '
          node --input-type=module -e "
            import { boot } from 'beam.com';
            const lines = [];
            const log = console.log;
            console.log = (...a) => { lines.push(a.join(' ')); log(...a); };
            await boot('hashsum.com');
            for (let i = 0; i < 300 && !lines.some((l) => l.includes('usage: hashsum TEXT')); i++) {
              await new Promise((r) => setTimeout(r, 100));
            }
            process.exit(lines.some((l) => l.includes('usage: hashsum TEXT')) ? 0 : 1);
          "

      - name: The release of examples/phoenix_demo
        working-directory: examples/phoenix_demo
        env:
          MIX_ENV: prod
        run: |
          mix.com local.hex --force --if-missing
          mix.com deps.get --only prod
          mix.com compile
          mix.com assets.deploy
          rm -rf _build/prod/rel
          RELEASE_ERTS=false mix.com release --overwrite
          sh ../../bin/beam.com _build/prod/rel/phoenix_demo -o "$RUNNER_TEMP/phoenix_demo.com"
          ls -l "$RUNNER_TEMP/phoenix_demo.com"

      # LiveViewTest parses HTML with lazy_html: the NIF library in
      # WebAssembly of beam.com (docs/NIFS.md, "C++"), with no C++ compiler
      # and no download of a native library.
      - name: The tests of examples/phoenix_demo
        working-directory: examples/phoenix_demo
        env:
          MIX_ENV: test
        run: |
          mix.com deps.get
          mix.com test
          ls -l _build/test/lib/lazy_html/priv
          test -f _build/test/lib/lazy_html/priv/liblazy_html.wasm
          test ! -e _build/test/lib/lazy_html/priv/liblazy_html.so

      - name: Run phoenix_demo.com natively
        run: |
          SECRET_KEY_BASE=$(head -c 48 /dev/urandom | base64 -w0) DATABASE_PATH="$RUNNER_TEMP/native.db" \
            PHX_SERVER=true PHX_HOST=localhost PORT=4123 sh "$RUNNER_TEMP/phoenix_demo.com" > native.log 2>&1 &
          pid=$!
          for i in $(seq 1 300); do curl -fs -o /dev/null http://127.0.0.1:4123/ && break; sleep 0.2; done
          status=0
          curl -fsS http://127.0.0.1:4123/ | grep -q 'LiveView' || status=1
          kill "$pid"
          [ "$status" = 0 ] || { cat native.log; exit 1; }

      - name: Run phoenix_demo.com in Node.js
        run: |
          key=$(head -c 48 /dev/urandom | base64 -w0 | tr '+/' '-_')
          BOOT_ENV="{\"PORT\": \"4000\", \"HOME\": \"/tmp\", \"PHX_SERVER\": \"true\", \"PHX_HOST\": \"localhost\",
            \"DATABASE_PATH\": \"/tmp/phoenix_demo.db\", \"SECRET_KEY_BASE\": \"$key\"}" \
            node tests/host/boot_app_com.mjs "$RUNNER_TEMP/wasm32" "$RUNNER_TEMP/phoenix_demo.com" --get / --expect 'LiveView'

      # Projects that deploy at each git push, with the npm package of the
      # step "The npm package": the same worker.js in workerd and in Deno.
      # examples/phoenix_demo is stateful (a Durable Object), and
      # examples/worker is stateless (a VM in each isolate).
      - name: The apps on Workers and Deno, from the npm package
        run: |
          sh bin/beam.com examples/worker -o "$RUNNER_TEMP/worker.com"
          for name in phoenix_demo worker; do
            app="$RUNNER_TEMP/hosts-$name"
            mkdir -p "$app"
            for f in package.json worker.js wrangler.jsonc deno.json; do cp "examples/$name/$f" "$app/"; done
            cp "$RUNNER_TEMP/$name.com" "$app/app.com"
            (cd "$app" && npm install --no-audit --no-fund "$RUNNER_TEMP"/beam.com-*.tgz wrangler@4.142.0 deno@2.9.6)
          done
          # The limits of the hosts (tests/programs/limits_check.erl), as the
          # Durable Object and as the stateless Worker: 504, 503, a new VM, the
          # turns of a process that computes, and large uploads.
          sh bin/beam.com tests/programs/limits_check.erl -o "$RUNNER_TEMP/limits_check.com"
          for name in phoenix_demo worker; do
            cp -R "$RUNNER_TEMP/hosts-$name" "$RUNNER_TEMP/limits-$name"
            cp "$RUNNER_TEMP/limits_check.com" "$RUNNER_TEMP/limits-$name/app.com"
            sh tests/host/app_limits.sh "$RUNNER_TEMP/limits-$name"
          done
          sh tests/host/app_hosts.sh "$RUNNER_TEMP/hosts-phoenix_demo" / \
            'LiveView on Cloudflare Workers' 'LiveView on Deno' '/live/websocket?vsn=2.0.0'
          sh tests/host/app_hosts.sh "$RUNNER_TEMP/hosts-worker" /hello \
            'Hello from Erlang/OTP' 'Hello from Erlang/OTP' /ws
          # serve(app, { statics: false }): the VM serves priv/static, so
          # Plug.Static (gzip: true) gives its vary header. The host of the
          # default gives no vary header.
          cp -R "$RUNNER_TEMP/hosts-phoenix_demo" "$RUNNER_TEMP/statics-phoenix_demo"
          sed -i 's/serve(app);/serve(app, { statics: false });/' "$RUNNER_TEMP/statics-phoenix_demo/worker.js"
          grep -q 'statics: false' "$RUNNER_TEMP/statics-phoenix_demo/worker.js"
          sh tests/host/app_hosts.sh "$RUNNER_TEMP/statics-phoenix_demo" /robots.txt \
            'vary: accept-encoding' 'vary: accept-encoding'

      # The snapshot of the build (npx beam.com --snapshot): at the boot
      # point for examples/phoenix_demo (the first Durable Object restores
      # it, as the store has no snapshot yet), and a full one for
      # examples/worker (the stateless Worker restores its VM in the global
      # scope). Deno boots. examples/worker runs the file of --target wasm32
      # with -o FILE.com: the edge part, with no native program.
      - name: The apps on Workers and Deno, with the snapshot of the build
        run: |
          for name in phoenix_demo worker; do
            cp -R "$RUNNER_TEMP/hosts-$name" "$RUNNER_TEMP/snapshot-$name"
          done
          sh bin/beam.com examples/worker -o "$RUNNER_TEMP/worker-edge.com" --target wasm32
          [ "$(wc -c < "$RUNNER_TEMP/worker-edge.com")" -lt "$(wc -c < "$RUNNER_TEMP/worker.com")" ]
          cp "$RUNNER_TEMP/worker-edge.com" "$RUNNER_TEMP/snapshot-worker/app.com"
          sh tests/host/use_snapshot.sh "$RUNNER_TEMP/snapshot-phoenix_demo"
          sh tests/host/use_snapshot.sh "$RUNNER_TEMP/snapshot-worker" --full --warm /
          sh tests/host/app_hosts.sh "$RUNNER_TEMP/snapshot-phoenix_demo" / \
            'LiveView on Cloudflare Workers' 'LiveView on Deno' '/live/websocket?vsn=2.0.0'
          sh tests/host/app_hosts.sh "$RUNNER_TEMP/snapshot-worker" /hello \
            'Hello from Erlang/OTP' 'Hello from Erlang/OTP' /ws
          for name in phoenix_demo worker; do
            grep 'beam: ready in .*, snapshot .* KB in' "$RUNNER_TEMP/snapshot-$name/wrangler.log"
          done

      # The static site of phoenix_demo.com: its own small files, with the
      # code of the page from the npm package on a second origin, as from
      # jsDelivr (tests/page/app-site.mjs, check.mjs --cdn).
      - name: The site of phoenix_demo.com, with the page from a CDN
        run: |
          node tests/page/app-site.mjs runtime "$RUNNER_TEMP/phoenix_demo.com" "$RUNNER_TEMP/site"
          npm install --prefix wasm --no-audit --no-fund
          node tests/page/check.mjs "$RUNNER_TEMP/site" --base /repo/ --cdn runtime --phoenix-demo

  test:
    name: Run on ${{ matrix.name }}
    needs: [build, example-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-26.04 }
          - { name: Linux aarch64, os: ubuntu-24.04-arm }
          - { name: macOS arm64, os: macos-latest }
          - { name: macOS x86_64, os: macos-15-intel }
          - { name: Windows x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: bin
          merge-multiple: true

      - name: Run (Unix)
        if: runner.os != 'Windows'
        run: tests/run.sh bin

      - name: Run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tests/run.ps1 bin

      # The table goes to the summary of the run (docs/BENCHMARKS.md), after
      # a merge to main: a pull request has the performance gate.
      - name: Benchmarks (Unix)
        if: runner.os != 'Windows' && github.event_name != 'pull_request'
        run: |
          tests/bench/run.sh bin | tee bench.md
          { echo "### Benchmarks: ${{ matrix.name }}"; echo; cat bench.md; } >> "$GITHUB_STEP_SUMMARY"

      # The performance gate (tests/bench/gate.sh, docs/BENCHMARKS.md): the
      # beam.com of this change against the edge build of main, on this
      # machine at the same time.
      - name: Performance gate
        if: matrix.name == 'Linux x86_64' && github.event_name == 'pull_request'
        run: |
          mkdir -p base
          url=https://github.com/${{ github.repository }}/releases/download/edge
          for i in 1 2 3; do
            curl -fsSL -o base/beam.com "$url/beam.com" &&
              curl -fsSL -o base/beam.com.sha256 "$url/beam.com.sha256" && break
            sleep 30
          done
          (cd base && sha256sum -c beam.com.sha256)
          status=0
          tests/bench/gate.sh bin/beam.com base/beam.com > gate.md || status=$?
          cat gate.md
          { echo "### Performance gate"; echo; cat gate.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # The gate must fail for the interpreter (fib is about 2 times
      # slower), so that the gate itself stays live.
      - name: The gate fails for the interpreter
        if: matrix.name == 'Linux x86_64' && github.event_name == 'pull_request'
        run: |
          status=0
          ROUNDS=1 tests/bench/gate.sh bin/beam-emu.com bin/beam.com fib binary > emu.md || status=$?
          cat emu.md
          if [ "$status" != 1 ]; then
            echo "The gate gave the exit status $status for beam-emu.com, not 1."
            exit 1
          fi

      - name: Benchmarks (Windows)
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          tests/bench/run.ps1 -Dir bin | Tee-Object -FilePath bench.md
          "### Benchmarks: ${{ matrix.name }}`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content bench.md | Out-File -Append $env:GITHUB_STEP_SUMMARY

  # Ubuntu 26.04: the package index of the Ubuntu 24.04 image named an
  # ovmf that the mirrors no longer had, so each VM action read a new index
  # first, and that read waited until the time limit of the job when the
  # Ubuntu archives did not answer (October 2026).
  test-bsd:
    name: Run on ${{ matrix.name }}
    needs: [build, example-release]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: FreeBSD, vm: freebsd }
          - { name: NetBSD, vm: netbsd }
          # Cosmopolitan supports OpenBSD 7.3 or earlier. Its ksh runs an
          # APE file (sh ./beam.com), and the APE loader runs it too: one
          # job for each, at the same time.
          - { name: OpenBSD 7.3, vm: openbsd, runner: loader }
          - { name: OpenBSD 7.3 through sh, vm: openbsd, runner: sh }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: bin
          merge-multiple: true

      # The packages of QEMU for the VM actions, with time limits: when the
      # Ubuntu archives do not answer, the job stops before its own limit,
      # with this step in the log. The VM action then finds the packages.
      # The download is about 28 MB, and a slow mirror gave 100 KB/s.
      - name: Install QEMU
        run: |
          for try in 1 2; do
            sudo timeout 120 apt-get update -q &&
              sudo timeout 600 apt-get install -y -q -o Acquire::Retries=3 --no-install-recommends \
                qemu-utils qemu-system-x86 ovmf &&
              exit 0
            echo "Try $try to install QEMU failed."
            sleep 10
          done
          exit 1

      # The benchmarks run after a merge to main, not for a pull request
      # (the performance gate of the job test compares a pull request).
      - name: Run on FreeBSD
        if: matrix.vm == 'freebsd'
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1
        with:
          run: |
            sh tests/run.sh bin || exit 1
            if [ "${{ github.event_name }}" = pull_request ]; then
              echo "No benchmarks for a pull request." > bench.md
            else
              sh tests/bench/run.sh bin > bench.md
            fi

      # NetBSD's sh stops at the NUL bytes of the APE header (C13 of
      # docs/UPSTREAM.md): one start through sh shows it in the log, not
      # checked. The tests use the APE loader.
      - name: Run on NetBSD
        if: matrix.vm == 'netbsd'
        uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1
        with:
          run: |
            echo "== Through sh (not checked: NUL bytes in the APE header)"
            sh bin/beam.com --version 2>&1 | head -n 5 || true
            echo "== Through the APE loader"
            # Where Cosmopolitan's execve() looks for the loader, for the
            # helper programs that beam.com starts (it executes itself).
            cp bin/ape-x86_64.elf "$HOME/.ape-1.10"
            chmod +x "$HOME/.ape-1.10"
            RUNNER=bin/ape-x86_64.elf sh tests/run.sh bin || exit 1
            if [ "${{ github.event_name }}" = pull_request ]; then
              echo "No benchmarks for a pull request." > bench.md
            else
              RUNNER=bin/ape-x86_64.elf sh tests/bench/run.sh bin > bench.md
            fi

      - name: Run on OpenBSD through the APE loader
        if: matrix.vm == 'openbsd' && matrix.runner == 'loader'
        uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1
        with:
          release: "7.3"
          run: |
            # Where Cosmopolitan's execve() looks for the loader, for the
            # helper programs that beam.com starts (it executes itself).
            cp bin/ape-x86_64.elf "$HOME/.ape-1.10"
            chmod +x "$HOME/.ape-1.10"
            RUNNER=bin/ape-x86_64.elf sh tests/run.sh bin || exit 1
            if [ "${{ github.event_name }}" = pull_request ]; then
              echo "No benchmarks for a pull request." > bench.md
            else
              RUNNER=bin/ape-x86_64.elf sh tests/bench/run.sh bin > bench.md
            fi

      - name: Run on OpenBSD through sh
        if: matrix.vm == 'openbsd' && matrix.runner == 'sh'
        uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1
        with:
          release: "7.3"
          run: |
            sh tests/run.sh bin && echo "The benchmarks run in the job through the APE loader." > bench.md

      - name: Benchmarks
        run: |
          cat bench.md
          { echo "### Benchmarks: ${{ matrix.name }}"; echo; cat bench.md; } >> "$GITHUB_STEP_SUMMARY"

  # The beam.com of main at a fixed URL: the prerelease "edge", with its
  # SHA-256. Then the Deploy Hook of the Livebook Worker (the secret
  # LIVEBOOK_DEPLOY_HOOK, when it is set) builds wasm/livebook with it and
  # deploys it (Workers Builds, see wasm/livebook/build.sh).
  edge:
    name: Publish the edge binary
    needs: [unit, models, one-file, page, test, test-bsd]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # One publish at a time, and only the run of the newest commit of main
    # publishes: an older run that ends later does not replace edge.
    concurrency:
      group: edge
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      published: ${{ steps.newest.outputs.newest }}
    env:
      GH_TOKEN: ${{ github.token }}
      HOOK: ${{ secrets.LIVEBOOK_DEPLOY_HOOK }}
    steps:
      - name: Check that this run has the newest commit of main
        id: newest
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $head now: the run of that commit publishes edge"
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.newest.outputs.newest == 'true'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: steps.newest.outputs.newest == 'true'
        with:
          name: beam.com
          path: bin

      # The provenance of beam.com, as for a release: gh attestation verify
      # beam.com --repo sntran/BEAM.com.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: steps.newest.outputs.newest == 'true'
        with:
          subject-path: bin/beam.com

      # The script of pages-app.yml that checks the provenance, on the file
      # of this run, before the publish: when it fails, the old edge stays.
      - name: Check the provenance before the publish
        if: steps.newest.outputs.newest == 'true'
        run: |
          yq -r '.jobs.build.steps[] | select(.name == "Check the provenance of beam.com") | .run' \
            .github/workflows/pages-app.yml > "$RUNNER_TEMP/check.sh"
          grep -q 'gh attestation verify' "$RUNNER_TEMP/check.sh"
          cd bin
          TAG=edge bash -eo pipefail "$RUNNER_TEMP/check.sh"

      - name: Publish the prerelease edge
        if: steps.newest.outputs.newest == 'true'
        run: |
          cd bin
          sha256sum beam.com > beam.com.sha256
          gh release delete edge --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create edge beam.com beam.com.sha256 --repo "$GITHUB_REPOSITORY" \
            --prerelease --target "$GITHUB_SHA" --title edge \
            --notes "beam.com of main at $GITHUB_SHA. The next merge replaces it. To check where it comes from: \`gh attestation verify beam.com --repo $GITHUB_REPOSITORY\`."

      # The published beam.com is the file that the check took. The same
      # check stops on a copy with one changed byte.
      - name: Check the published edge
        if: steps.newest.outputs.newest == 'true'
        run: |
          mkdir -p check
          cd check
          curl -fsSL -o beam.com "https://github.com/$GITHUB_REPOSITORY/releases/download/edge/beam.com"
          cmp beam.com ../bin/beam.com
          python3 -c 'import sys; p = sys.argv[1]; b = bytearray(open(p, "rb").read()); b[4096] ^= 1; open(p, "wb").write(b)' beam.com
          if cmp -s beam.com ../bin/beam.com; then echo "the copy did not change" >&2; exit 1; fi
          if TAG=edge bash -eo pipefail "$RUNNER_TEMP/check.sh" > out.txt 2>&1; then
            cat out.txt
            echo "the check took a changed beam.com" >&2
            exit 1
          fi
          cat out.txt
          grep -q '^::error::Could not verify the provenance of beam.com edge' out.txt

      - name: Build the Livebook Worker again
        if: steps.newest.outputs.newest == 'true' && env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" > /dev/null

  # pages-app.yml with the edge that the job edge published, as an app
  # repository calls it: the check of the provenance with a token that can
  # only read (contents: read, and the two permissions of Pages).
  pages-edge:
    name: Build a site with edge
    needs: edge
    if: needs.edge.outputs.published == 'true'
    concurrency:
      group: edge
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages-app.yml
    with:
      path: examples/worker
      beam-com: edge
      deploy: false
      name: site-edge

  # The places of the version (scripts/version.sh). Then the check of the
  # provenance of pages-app.yml on the newest release, as an app
  # repository runs it with the tag of that release (the job edge checks
  # only edge). The same check must refuse a copy of that beam.com with
  # one changed byte.
  release-check:
    name: Check the version and the newest release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check the version in each file
        run: scripts/version.sh

      - name: Check the newest release as pages-app.yml does
        run: |
          tag=$(gh api "repos/sntran/BEAM.com/releases?per_page=30" \
            --jq '[.[] | select(.draft | not) | select(.tag_name | test("^v[0-9]"))][0].tag_name')
          echo "the newest release: $tag"
          yq -r '.jobs.build.steps[] | select(.name == "Check the provenance of beam.com") | .run' \
            .github/workflows/pages-app.yml > "$RUNNER_TEMP/check.sh"
          grep -q 'gh attestation verify' "$RUNNER_TEMP/check.sh"
          mkdir -p "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          curl -fsSL -o beam.com "https://github.com/sntran/BEAM.com/releases/download/$tag/beam.com"
          TAG=$tag bash -eo pipefail "$RUNNER_TEMP/check.sh"
          python3 -c 'import sys; p = sys.argv[1]; b = bytearray(open(p, "rb").read()); b[4096] ^= 1; open(p, "wb").write(b)' beam.com
          if TAG=$tag bash -eo pipefail "$RUNNER_TEMP/check.sh" > out.txt 2>&1; then
            cat out.txt
            echo "the check took a changed beam.com" >&2
            exit 1
          fi
          cat out.txt
          grep -q "^::error::Could not verify the provenance of beam.com $tag" out.txt

  # The release of a tag vX.Y.Z or vX.Y.Z-rc.N, or of a run by hand on
  # main with the input release (the job makes the tag), after all the
  # tests:
  # beam.com, beam-emu.com and the tarball of the npm package, with their
  # SHA-256, and the same tarball on npm. The tag must be the version of
  # beam.com (the vsn of src/beam_com/beam_com.app.src). The files of
  # beam.com come from the tested run of the job reuse, else from this run.
  # A run of this job again (a re-run) puts its files on the release that
  # is there, and does not publish a version that npm has. When npm has
  # the version, the re-run must have the same beam.com (the step "Check
  # the files of npm"), so the files of npm and of the release stay equal.
  #
  # With no tested run to reuse, this run builds and tests the commit, and
  # each test job must pass. The page job needs pages-app, and test needs
  # example-release, so their results count too.
  release:
    name: Publish the release
    needs: [reuse, unit, models, example-release, one-file, pages-app, page, test, test-bsd]
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release != '')) &&
      (needs.reuse.outputs.run != '' || (needs.unit.result == 'success' &&
        needs.models.result == 'success' && needs.example-release.result == 'success' &&
        needs.one-file.result == 'success' && needs.pages-app.result == 'success' &&
        needs.page.result == 'success' && needs.test.result == 'success' &&
        needs.test-bsd.result == 'success'))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      # A run by hand: the tag of the input release, which the step "Make
      # the tag" makes.
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.release) || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The tag is the version of beam.com in each file that has it, and
      # its commit is on main: a tag that a person pushes on another
      # commit (a branch) publishes nothing.
      - name: Check the version
        run: |
          scripts/version.sh "$TAG"
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)
          case $status in
            identical | ahead) echo "the commit $GITHUB_SHA is on main" ;;
            *) echo "The commit $GITHUB_SHA of $TAG is not on main ($status)" >&2; exit 1 ;;
          esac

      # A token gives the files of another run (the tested run of reuse);
      # with no token, the files of this run.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: beam.com
          path: bin
          run-id: ${{ needs.reuse.outputs.run || github.run_id }}
          github-token: ${{ needs.reuse.outputs.run && github.token || '' }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: beam-emu.com
          path: bin
          run-id: ${{ needs.reuse.outputs.run || github.run_id }}
          github-token: ${{ needs.reuse.outputs.run && github.token || '' }}

      # npm 11.5.1 or later publishes with the token of this run (trusted
      # publishing, OIDC), with provenance.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "26"

      # The tarball of the npm package of the same version (package.json,
      # scripts/npm.sh): npx beam.com downloads the beam.com of this
      # release, with its SHA-256. The release holds this tarball, and the
      # step "Publish the npm package" publishes the same file.
      - name: Make the npm package
        run: |
          chmod +x bin/beam.com
          sh bin/beam.com examples/hashsum.erl -o "$RUNNER_TEMP/wasm32" --target wasm32 > /dev/null
          scripts/npm.sh bin/beam.com "$RUNNER_TEMP/wasm32"
          npm pack --pack-destination bin
          test -f "bin/beam.com-${TAG#v}.tgz"

      # A re-run after npm has the version: the package on npm holds the
      # SHA-256 of beam.com (runtime/release.json), and npx beam.com checks
      # the file of the release with it. So the release keeps that
      # beam.com, and the tarball of npm. A run with another beam.com stops
      # here, before it replaces a file of the release.
      - name: Check the files of npm
        run: |
          vsn=${TAG#v}
          if ! npm view "beam.com@$vsn" version > /dev/null 2>&1; then
            echo "npm does not have beam.com@$vsn: the release gets the files of this run"
            exit 0
          fi
          mkdir "$RUNNER_TEMP/npm"
          (cd "$RUNNER_TEMP/npm" && npm pack --loglevel=warn "beam.com@$vsn" > /dev/null)
          tar -xzf "$RUNNER_TEMP/npm/beam.com-$vsn.tgz" -C "$RUNNER_TEMP/npm" package/runtime/release.json
          want=$(node -p "require(process.argv[1]).sha256" "$RUNNER_TEMP/npm/package/runtime/release.json")
          got=$(sha256sum bin/beam.com | cut -d' ' -f1)
          if [ "$want" != "$got" ]; then
            echo "npm has beam.com@$vsn for the beam.com with the SHA-256 $want, and this run has $got." >&2
            echo "npx beam.com refuses another file: make a new version, or re-run the job of the first build." >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/npm/beam.com-$vsn.tgz" "bin/beam.com-$vsn.tgz"
          echo "npm has beam.com@$vsn for this beam.com: the release gets the tarball of npm"

      # The provenance of the files (a signed statement of the workflow and
      # the commit that built them): gh attestation verify FILE --repo
      # sntran/BEAM.com.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            bin/beam.com
            bin/beam-emu.com
            bin/beam.com-*.tgz

      # A run by hand: the annotated tag of the version on this commit of
      # main. A tag that the token of a run pushes starts no other run, so
      # this run publishes the release itself. A re-run finds the tag of
      # this commit; a tag on another commit stops the job.
      - name: Make the tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2>/dev/null); then
            sha=${ref#* }
            case $ref in
              tag\ *) sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha) ;;
            esac
            if [ "$sha" != "$GITHUB_SHA" ]; then
              echo "The tag $TAG is on $sha, not on $GITHUB_SHA" >&2
              exit 1
            fi
            echo "the tag $TAG is on this commit"
            exit 0
          fi
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="BEAM.com ${TAG#v}" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$tag" > /dev/null
          echo "made the tag $TAG on $GITHUB_SHA"

      # The script of pages-app.yml that checks the provenance, on the
      # beam.com of this release, before the publish: pages-app.yml at this
      # tag takes the file. When the check fails, nothing is published.
      - name: Check the provenance as pages-app.yml does
        run: |
          yq -r '.jobs.build.steps[] | select(.name == "Check the provenance of beam.com") | .run' \
            .github/workflows/pages-app.yml > "$RUNNER_TEMP/check.sh"
          grep -q 'gh attestation verify' "$RUNNER_TEMP/check.sh"
          cd bin
          bash -eo pipefail "$RUNNER_TEMP/check.sh"

      - name: Publish the release
        run: |
          cd bin
          tgz=beam.com-${TAG#v}.tgz
          sha256sum beam.com beam-emu.com "$tgz" > SHA256SUMS
          # The section of this version in CHANGELOG.md, then the files.
          awk -v v="## ${TAG#v}" '$0 == v {on = 1; next} /^## / {on = 0} on' \
            ../CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ---

          Erlang/OTP $OTP_VERSION and Elixir in one executable file, for Linux,
          macOS, Windows and the BSDs, on x86_64 and aarch64.

          - \`beam.com\`: with the JIT. Use this file.
          - \`beam-emu.com\`: with the BEAM interpreter. It is smaller and
            starts faster, but Erlang code runs slower.
          - \`$tgz\`: the npm package, the same file as on npm. To
            install it with no registry:

            \`\`\`sh
            npm install https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$tgz
            \`\`\`
          - \`SHA256SUMS\`: check the files with \`sha256sum -c SHA256SUMS\`.
            To check where they come from: \`gh attestation verify beam.com
            --repo $GITHUB_REPOSITORY\`.

          On Windows, copy the file to a name that ends with \`.exe\`.
          EOF
          # A version with a "-" (0.1.0-rc.1) is a release candidate: a
          # pre-release, which is not the latest release.
          case $TAG in
              *-*) pre=--prerelease ;;
              *) pre= ;;
          esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A re-run: the release is there. Its notes stay.
            gh release upload "$TAG" beam.com beam-emu.com "$tgz" SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" beam.com beam-emu.com "$tgz" SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $pre \
              --title "BEAM.com $TAG" --notes-file notes.md --generate-notes
          fi

      # The tarball of the step "Make the npm package". The trusted
      # publisher on npmjs.com is this workflow (build.yml). Without it, the
      # secret NPM_TOKEN gives the token.
      - name: Publish the npm package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "beam.com@${TAG#v}" version > /dev/null 2>&1; then
            echo "npm has beam.com@${TAG#v}: a re-run publishes nothing"
            exit 0
          fi
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > "$RUNNER_TEMP/.npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          fi
          # A release candidate gets the dist-tag next: npm install beam.com
          # does not install it, npm install beam.com@next does.
          case $TAG in
              *-*) dist=next ;;
              *) dist=latest ;;
          esac
          # The path starts with "./": else npm reads bin/... as a GitHub
          # repository (user/repo).
          npm publish "./bin/beam.com-${TAG#v}.tgz" --provenance --access public --tag "$dist"
