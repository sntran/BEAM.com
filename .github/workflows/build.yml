name: Build and test BEAM.com

# One run for each change: a pull request runs CI for its branch, and a
# push runs it only on main (after a merge). A change of the docs only
# (Markdown files, docs/, the issue forms) starts no run. Run the
# workflow by hand (workflow_dispatch) to test a branch without a pull
# request. A tag vX.Y.Z starts a run that publishes the release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE*"
  workflow_dispatch:

# A new push to a pull request stops the run of its older commit. Runs
# on main are not stopped, so that each merge is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The token of a job can read the repository. Only the jobs that publish
# (edge and release) can write, and each one says so.
permissions:
  contents: read

env:
  OTP_VERSION: "29.1.1"
  COSMOCC_VERSION: "4.0.2"
  OPENSSL_VERSION: "4.0.3"
  EMSDK_VERSION: "6.0.10"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # beam.com has the JIT: one fat file with the x86 and the arm
          # backend. beam-emu.com has the interpreter.
          - { name: Build, jit: "1", out: beam.com }
          - { name: Build the interpreter, jit: "0", out: beam-emu.com }
    env:
      JIT: ${{ matrix.jit || '1' }}
      CC: ${{ matrix.cc || 'cosmocc' }}
      AR: ${{ matrix.ar || 'cosmoar' }}
      OUT: ${{ github.workspace }}/build/${{ matrix.out }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache cosmocc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/cosmocc
          # "checked": the cache of a download with its SHA-256 checked.
          key: cosmocc-${{ env.COSMOCC_VERSION }}-checked

      - name: Download cosmocc
        run: ./build.sh toolchain

      - name: Cache OpenSSL
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-cosmocc-${{ env.COSMOCC_VERSION }}-${{ matrix.cc || 'cosmocc' }}

      - name: Register the APE loader
        # Lets the kernel run APE files (the OTP build runs the tools it
        # builds). WINE and other MZ handlers on the runner are disabled.
        run: |
          sudo cp build/cosmocc/bin/ape-x86_64.elf /usr/bin/ape
          sudo sh -c 'echo -1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c 'echo 1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"
          sudo sh -c "echo ':APE-jart:M::jartsr::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"

      # The WebAssembly runtime of --target wasm32 (the step wasm_runtime):
      # Emscripten, and OpenSSL built with it.
      - name: Cache emsdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-checked

      - name: Cache OpenSSL for WebAssembly
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/wasm/openssl
          key: wasm-openssl-${{ env.OPENSSL_VERSION }}-emsdk-${{ env.EMSDK_VERSION }}

      - name: Build
        run: ./build.sh openssl otp configure sqlite nifs wasm make elixir release multicall wasm_runtime bundle

      - name: Upload ${{ matrix.out }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.out }}
          path: build/${{ matrix.out }}
          if-no-files-found: error

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: matrix.out == 'beam.com'
        with:
          go-version: stable
          cache: false

      - name: Build the WASI example in Go
        if: matrix.out == 'beam.com'
        run: |
          cd tests/programs/hello_go
          GOOS=wasip1 GOARCH=wasm go build -o ../../../build/hello_go.wasm .

      - name: Upload the WASI example
        if: matrix.out == 'beam.com'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hello_go.wasm
          path: build/hello_go.wasm
          if-no-files-found: error

      - name: Upload the APE loader
        if: matrix.out == 'beam.com'
        # NetBSD and OpenBSD cannot run APE files through sh.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ape-loader
          path: build/cosmocc/bin/ape-x86_64.elf
          if-no-files-found: error

      - name: Test
        timeout-minutes: 5
        run: BEAM_COM_VERBOSE=1 timeout 120 ./build.sh test

      # The file formats of the output and of a program that it built
      # (tests/check_format.sh): ZIP, PE, ELF and Mach-O. The Mach-O check
      # needs llvm-objdump.
      - name: Check the file formats
        timeout-minutes: 10
        run: |
          command -v llvm-objdump >/dev/null ||
            { sudo apt-get update -q >/dev/null && sudo apt-get install -y -q llvm >/dev/null; }
          tests/check_format.sh "$OUT" build/hashsum.com

      # The differential test runs beam.wasm in Node.js, and needs JSPI
      # (Node.js 25 or later).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: matrix.out == 'beam.com'
        with:
          node-version: "26"

      - name: Unit tests
        if: matrix.out == 'beam.com'
        timeout-minutes: 10
        run: ./build.sh unit

      - name: Trace a failed test
        if: failure()
        timeout-minutes: 5
        run: |
          sudo apt-get install -y strace >/dev/null || true
          BEAM_COM_VERBOSE=1 timeout 60 strace -f -tt -s 200 -o build/strace.txt "$OUT" one two || true
          ps -ef | grep -v grep | grep -i beam || true
          tail -n 80 build/strace.txt || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-logs-${{ matrix.out }}
          path: |
            build/otp/erts/config.log
            build/otp/config.log
            build/otp/make/*/otp.mk
            build/strace.txt
          if-no-files-found: ignore

  # The models of the protocols (specs/ and lib/beam_com/protocol) with
  # TLC: mix beam_com.tlc. It needs no build of beam.com.
  models:
    name: Check the models
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TLA2TOOLS_JAR: ${{ github.workspace }}/tla2tools.jar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: "1.20.4"
      # tla2tools.jar v1.7.4 is the pinned stable release. v1.8.0 is a
      # pre-release that the project publishes again each night, so its
      # jar and its checksum change (docs/TESTING.md).
      - name: Install tla2tools.jar
        run: |
          curl -fsSL -o "$TLA2TOOLS_JAR" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $TLA2TOOLS_JAR" | sha256sum -c -
          java -version
      - name: Check the models with TLC
        run: |
          mix deps.get
          mix beam_com.tlc

  example-release:
    name: Add a rebar3 release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: beam.com

      # A normal Erlang/OTP and rebar3, as a user has them.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: "3"

      - name: Build the example releases and add them to beam.com
        run: |
          for src in examples/greeter tests/programs/crypto_check tests/programs/tls_check; do
            app=$(basename "$src")
            (cd "$src" && rebar3 release)
            cp beam.com "$app.com"
            (cd "$src/_build/default/rel/$app" &&
             find releases lib -type f | sort &&
             zip -r "$GITHUB_WORKSPACE/$app.com" releases lib)
          done

      - name: Upload the example releases
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: examples
          path: |
            greeter.com
            crypto_check.com
            tls_check.com
          if-no-files-found: error

  test:
    name: Run on ${{ matrix.name }}
    needs: [build, example-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-latest }
          - { name: Linux aarch64, os: ubuntu-24.04-arm }
          - { name: macOS arm64, os: macos-latest }
          - { name: macOS x86_64, os: macos-15-intel }
          - { name: Windows x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: bin
          merge-multiple: true

      - name: Run (Unix)
        if: runner.os != 'Windows'
        run: tests/run.sh bin

      - name: Run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tests/run.ps1 bin

      # The table goes to the summary of the run (docs/BENCHMARKS.md).
      - name: Benchmarks (Unix)
        if: runner.os != 'Windows'
        run: |
          tests/bench/run.sh bin | tee bench.md
          { echo "### Benchmarks: ${{ matrix.name }}"; echo; cat bench.md; } >> "$GITHUB_STEP_SUMMARY"

      # The performance gate (tests/bench/gate.sh, docs/BENCHMARKS.md): the
      # beam.com of this change against the edge build of main, on this
      # machine at the same time.
      - name: Performance gate
        if: matrix.name == 'Linux x86_64' && github.event_name == 'pull_request'
        run: |
          mkdir -p base
          url=https://github.com/${{ github.repository }}/releases/download/edge
          for i in 1 2 3; do
            curl -fsSL -o base/beam.com "$url/beam.com" &&
              curl -fsSL -o base/beam.com.sha256 "$url/beam.com.sha256" && break
            sleep 30
          done
          (cd base && sha256sum -c beam.com.sha256)
          status=0
          tests/bench/gate.sh bin/beam.com base/beam.com > gate.md || status=$?
          cat gate.md
          { echo "### Performance gate"; echo; cat gate.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # The gate must fail for the interpreter (fib is about 2 times
      # slower), so that the gate itself stays live.
      - name: The gate fails for the interpreter
        if: matrix.name == 'Linux x86_64' && github.event_name == 'pull_request'
        run: |
          status=0
          ROUNDS=1 tests/bench/gate.sh bin/beam-emu.com bin/beam.com fib binary > emu.md || status=$?
          cat emu.md
          if [ "$status" != 1 ]; then
            echo "The gate gave the exit status $status for beam-emu.com, not 1."
            exit 1
          fi

      - name: Benchmarks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          tests/bench/run.ps1 -Dir bin | Tee-Object -FilePath bench.md
          "### Benchmarks: ${{ matrix.name }}`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content bench.md | Out-File -Append $env:GITHUB_STEP_SUMMARY

  test-bsd:
    name: Run on ${{ matrix.name }}
    needs: [build, example-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: FreeBSD, vm: freebsd }
          - { name: NetBSD, vm: netbsd }
          # Cosmopolitan supports OpenBSD 7.3 or earlier.
          - { name: OpenBSD 7.3, vm: openbsd }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: bin
          merge-multiple: true

      - name: Run on FreeBSD
        if: matrix.vm == 'freebsd'
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1
        with:
          run: |
            sh tests/run.sh bin && sh tests/bench/run.sh bin > bench.md

      - name: Run on NetBSD
        if: matrix.vm == 'netbsd'
        uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1
        with:
          run: |
            echo "== Through sh (known to fail: NUL bytes in the APE header)"
            LIMIT=30 sh tests/run.sh bin || true
            echo "== Through the APE loader"
            # Where Cosmopolitan's execve() looks for the loader, for the
            # helper programs that beam.com starts (it executes itself).
            cp bin/ape-x86_64.elf "$HOME/.ape-1.10"
            chmod +x "$HOME/.ape-1.10"
            RUNNER=bin/ape-x86_64.elf sh tests/run.sh bin &&
              RUNNER=bin/ape-x86_64.elf sh tests/bench/run.sh bin > bench.md

      - name: Run on OpenBSD
        if: matrix.vm == 'openbsd'
        uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1
        with:
          release: "7.3"
          run: |
            echo "== Through sh (known to fail: NUL bytes in the APE header)"
            LIMIT=30 sh tests/run.sh bin || true
            echo "== Through the APE loader"
            # Where Cosmopolitan's execve() looks for the loader, for the
            # helper programs that beam.com starts (it executes itself).
            cp bin/ape-x86_64.elf "$HOME/.ape-1.10"
            chmod +x "$HOME/.ape-1.10"
            RUNNER=bin/ape-x86_64.elf sh tests/run.sh bin &&
              RUNNER=bin/ape-x86_64.elf sh tests/bench/run.sh bin > bench.md

      - name: Benchmarks
        run: |
          cat bench.md
          { echo "### Benchmarks: ${{ matrix.name }}"; echo; cat bench.md; } >> "$GITHUB_STEP_SUMMARY"

  # The beam.com of main at a fixed URL: the prerelease "edge", with its
  # SHA-256. Then the Deploy Hook of the Livebook Worker (the secret
  # LIVEBOOK_DEPLOY_HOOK, when it is set) builds wasm/livebook with it and
  # deploys it (Workers Builds, see wasm/livebook/build.sh).
  edge:
    name: Publish the edge binary
    needs: [test, test-bsd]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One publish at a time, and only the run of the newest commit of main
    # publishes: an older run that ends later does not replace edge.
    concurrency:
      group: edge
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      HOOK: ${{ secrets.LIVEBOOK_DEPLOY_HOOK }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: beam.com
          path: bin

      - name: Publish the prerelease edge
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is at $head now: the run of that commit publishes edge"
            exit 0
          fi
          cd bin
          sha256sum beam.com > beam.com.sha256
          gh release delete edge --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create edge beam.com beam.com.sha256 --repo "$GITHUB_REPOSITORY" \
            --prerelease --target "$GITHUB_SHA" --title edge \
            --notes "beam.com of main at $GITHUB_SHA. The next merge replaces it."

      - name: Build the Livebook Worker again
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" > /dev/null

  # The release of a tag vX.Y.Z, after all the tests: beam.com and
  # beam-emu.com, with their SHA-256. The tag must be the version of
  # beam.com (the vsn of src/beam_com/beam_com.app.src).
  release:
    name: Publish the release
    needs: [test, test-bsd]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check the version
        run: |
          vsn=$(sed -n 's/.*{vsn, *"\([^"]*\)".*/\1/p' src/beam_com/beam_com.app.src)
          if [ "v$vsn" != "$TAG" ]; then
            echo "The tag $TAG is not the version of beam.com (v$vsn)" >&2
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: beam.com
          path: bin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: beam-emu.com
          path: bin

      # The provenance of the files (a signed statement of the workflow and
      # the commit that built them): gh attestation verify FILE --repo
      # sntran/BEAM.com.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            bin/beam.com
            bin/beam-emu.com

      - name: Publish the release
        run: |
          cd bin
          sha256sum beam.com beam-emu.com > SHA256SUMS
          # The section of this version in CHANGELOG.md, then the files.
          awk -v v="## ${TAG#v}" '$0 == v {on = 1; next} /^## / {on = 0} on' \
            ../CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ---

          Erlang/OTP $OTP_VERSION and Elixir in one executable file, for Linux,
          macOS, Windows and the BSDs, on x86_64 and aarch64.

          - \`beam.com\`: with the JIT. Use this file.
          - \`beam-emu.com\`: with the BEAM interpreter. It is smaller and
            starts faster, but Erlang code runs slower.
          - \`SHA256SUMS\`: check the files with \`sha256sum -c SHA256SUMS\`.
            To check where they come from: \`gh attestation verify beam.com
            --repo $GITHUB_REPOSITORY\`.

          On Windows, copy the file to a name that ends with \`.exe\`.
          EOF
          gh release create "$TAG" beam.com beam-emu.com SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "BEAM.com $TAG" --notes-file notes.md --generate-notes
