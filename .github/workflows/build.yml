name: Build and test BEAM.com

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  OTP_VERSION: "28.5"
  COSMOCC_VERSION: "4.0.2"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cosmocc
        uses: actions/cache@v4
        with:
          path: build/cosmocc
          key: cosmocc-${{ env.COSMOCC_VERSION }}

      - name: Download cosmocc
        run: ./build.sh toolchain

      - name: Register the APE loader
        # Lets the kernel run APE files (the OTP build runs the tools it
        # builds). WINE and other MZ handlers on the runner are disabled.
        run: |
          sudo cp build/cosmocc/bin/ape-x86_64.elf /usr/bin/ape
          sudo sh -c 'echo -1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c 'echo 1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"
          sudo sh -c "echo ':APE-jart:M::jartsr::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"

      - name: Build
        run: ./build.sh otp configure make release multicall bundle

      - name: Test
        run: ./build.sh test

      - name: Upload beam.com
        uses: actions/upload-artifact@v4
        with:
          name: beam.com
          path: build/beam.com
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/otp/erts/config.log
            build/otp/config.log
            build/otp/make/*/otp.mk
          if-no-files-found: ignore

  test:
    name: Run on ${{ matrix.name }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-latest }
          - { name: Linux aarch64, os: ubuntu-24.04-arm }
          - { name: macOS arm64, os: macos-latest }
          - { name: macOS x86_64, os: macos-15-intel }
          - { name: Windows x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beam.com

      - name: Run (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x beam.com
          sh ./beam.com hello from "${{ matrix.name }}" | tee out.txt
          grep -q "Hello, World!" out.txt

      - name: Run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item beam.com beam.exe
          .\beam.exe hello from Windows | Tee-Object -FilePath out.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path out.txt -Pattern "Hello, World!" -Quiet)) { exit 1 }

  test-bsd:
    name: Run on ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: FreeBSD, vm: freebsd }
          - { name: NetBSD, vm: netbsd }
          - { name: OpenBSD, vm: openbsd }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beam.com

      - name: Run on FreeBSD
        if: matrix.vm == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          run: |
            chmod +x beam.com
            sh ./beam.com hello from FreeBSD | tee out.txt
            grep -q "Hello, World!" out.txt

      - name: Run on NetBSD
        if: matrix.vm == 'netbsd'
        uses: vmactions/netbsd-vm@v1
        with:
          run: |
            chmod +x beam.com
            sh ./beam.com hello from NetBSD | tee out.txt
            grep -q "Hello, World!" out.txt

      - name: Run on OpenBSD
        if: matrix.vm == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          run: |
            chmod +x beam.com
            sh ./beam.com hello from OpenBSD | tee out.txt
            grep -q "Hello, World!" out.txt
