name: Custom build

# The builder of custom builds: a one-off build for the user who asks, no
# release. Two sources start it:
#
# - An issue of the form "A custom build of beam.com" (label
#   custom-build): the file as an artifact of the run, a comment with its
#   link, and the issue closed.
# - workflow_dispatch from the FIFO beam.com of mkfifo.com
#   (priv/seeds/beam.com/), for a person with no GitHub account: a
#   queue of one build at a time, the file in the prerelease
#   custom-builds, and the answer to the FIFO, which emails the link. The inputs have the same rules as the
#   issue (scripts/custom_build.py).
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      apps:
        description: More OTP applications, with spaces or commas
        type: string
        default: ""
      keep:
        description: >-
          The word keep, and the default OTP applications to keep (the others
          that a build can leave out go out). Empty keeps each one.
        type: string
        default: ""
      hex:
        description: Hex (0 or 1)
        type: string
        default: "0"
      rebar3:
        description: rebar3 (0 or 1)
        type: string
        default: "0"
      elixir:
        description: Elixir (0 or 1), or empty for Elixir only with an elixir_version (the form of mkfifo.com)
        type: string
        default: "1"
      jit:
        description: The JIT (1), or the interpreter (0)
        type: string
        default: "1"
      sqlite:
        description: SQLite (0 or 1)
        type: string
        default: "1"
      wasm:
        description: WebAssembly, WAMR (0 or 1)
        type: string
        default: "1"
      nifs:
        description: More NIFs (picosat_elixir, vix, vix-icc, vix-gif, vix-avif, vix-svg, rusty_csv, ex_pdfium), with spaces or commas. With the word default, the default NIFs to keep (exqlite, bcrypt_elixir, argon2_elixir); without it, all of them
        type: string
        default: ""
      otp_version:
        description: The version of Erlang/OTP (OTP_VERSIONS of scripts/custom_build.py). Empty for the default.
        type: string
        default: ""
      elixir_version:
        description: The version of Elixir (ELIXIR_VERSIONS of scripts/custom_build.py). Empty for the default, or for no Elixir when the input elixir is empty.
        type: string
        default: ""
      reply:
        description: The encrypted address of the requester (from the FIFO beam.com of mkfifo.com)
        type: string
        default: ""
      url:
        description: >-
          A build of a URL of the FIFO beam.com, as plus.NIF.NIF or only.NIF (custom_build.py URL):
          the defaults of the form and these NIFs, the file beam-u.URL.com, and no email.
          The other inputs do not change it.
        type: string
        default: ""

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.url != '' && format('Custom build of the URL {0}', inputs.url)
  || github.event_name == 'workflow_dispatch' && 'Custom build from mkfifo.com/beam.com'
  || format('Custom build for issue {0}', github.event.issue.number) }}

permissions:
  # The files of the FIFO beam.com go to the prerelease custom-builds.
  # The checkout keeps no token, so the steps of the build cannot use it.
  contents: write
  issues: write
  # The queue of beam.com reads the runs of this workflow.
  actions: read

# One build for each issue. Each run of beam.com has its own group:
# the queue of scripts/custom_build.py keeps all the requests, where a
# group keeps only one that waits. A build of a URL has one group for
# each URL: the FIFO asks again while the client waits, and the group
# keeps the build that runs and one that waits (it finds the file).
concurrency:
  group: custom-build-${{ github.event.issue.number || (inputs.url != '' && format('url-{0}', inputs.url)) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ inputs.url == '' }}

# The step "Read the choices" sets OTP_VERSION and ELIXIR_VERSION, with
# their commits.
env:
  COSMOCC_VERSION: "4.0.2"
  OPENSSL_VERSION: "4.0.3"
  EMSDK_VERSION: "6.0.10"

jobs:
  build:
    # Only a member of the repository starts a build: a build takes 90
    # minutes of a runner, and it writes the caches of main. A member
    # opens the issue, or adds the label to the issue of another user
    # (only a user who can triage can label the issue of another user).
    # workflow_dispatch needs write access: the token of beam.com.
    if: >-
      github.event_name == 'workflow_dispatch' || (
      contains(github.event.issue.labels.*.name, 'custom-build') &&
      github.event.issue.state == 'open' && (
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) || (
          github.event.action == 'labeled' &&
          github.event.label.name == 'custom-build' &&
          github.event.sender.login != github.event.issue.user.login)))
    runs-on: ubuntu-26.04
    # A run of beam.com can wait for 3 builds first.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the choices
        env:
          EVENT: ${{ github.event_name }}
          BODY: ${{ github.event.issue.body }}
          INPUT_APPS: ${{ inputs.apps }}
          INPUT_KEEP: ${{ inputs.keep }}
          INPUT_HEX: ${{ inputs.hex }}
          INPUT_REBAR3: ${{ inputs.rebar3 }}
          INPUT_ELIXIR: ${{ inputs.elixir }}
          INPUT_JIT: ${{ inputs.jit }}
          INPUT_SQLITE: ${{ inputs.sqlite }}
          INPUT_WASM: ${{ inputs.wasm }}
          INPUT_NIFS: ${{ inputs.nifs }}
          INPUT_OTP_VERSION: ${{ inputs.otp_version }}
          INPUT_ELIXIR_VERSION: ${{ inputs.elixir_version }}
          INPUT_REPLY: ${{ inputs.reply }}
          INPUT_URL: ${{ inputs.url }}
        # The text of the issue and the inputs are input of a user: they
        # only select known values (scripts/custom_build.py).
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then source=dispatch; else source=issue; fi
          python3 -I scripts/custom_build.py "$source" "$GITHUB_SHA"

      - name: Check the names of the applications
        if: env.REFUSED == ''
        run: |
          git clone -q --depth 1 --branch "OTP-$OTP_VERSION" https://github.com/erlang/otp.git build/otp
          # A request of the FIFO gets the name in its answer (the names
          # have only the characters of custom_build.py).
          for app in $OTP_APPS; do
            [ -d "build/otp/lib/$app/src" ] && continue
            echo "No OTP application: $app" >&2
            [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || exit 1
            printf 'REFUSED=choice\nREFUSED_DETAIL=No OTP application: %s\n' "$app" >> "$GITHUB_ENV"
            break
          done

      # The FIFO beam.com: a file with the same choices of the same commit is
      # in the release already. The files of more than 30 days go away.
      - name: Find a build with the same choices
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I scripts/custom_build.py cleanup
          if python3 -I scripts/custom_build.py exists; then echo REUSE=1 >> "$GITHUB_ENV"; fi

      # The FIFO beam.com: one build at a time, in the sequence of the
      # requests, at most 3 that wait, and at most 10 new builds each day.
      # A request that waited can find the file of an identical request.
      - name: Wait for the turn
        if: github.event_name == 'workflow_dispatch' && env.REUSE != '1' && env.REFUSED == ''
        timeout-minutes: 185
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I scripts/custom_build.py queue
          if python3 -I scripts/custom_build.py exists; then echo REUSE=1 >> "$GITHUB_ENV"; fi

      - name: Cache cosmocc
        if: env.REUSE != '1' && env.REFUSED == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/cosmocc
          key: cosmocc-${{ env.COSMOCC_VERSION }}-checked

      - name: Download cosmocc
        if: env.REUSE != '1' && env.REFUSED == ''
        # The GNU make of the host gets cosmocc. Then the make of cosmocc
        # runs the build.
        run: make toolchain

      - name: Cache OpenSSL
        if: env.REUSE != '1' && env.REFUSED == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-cosmocc-${{ env.COSMOCC_VERSION }}-cosmocc

      - name: Register the APE loader
        if: env.REUSE != '1' && env.REFUSED == ''
        run: |
          sudo cp build/cosmocc/bin/ape-x86_64.elf /usr/bin/ape
          sudo sh -c 'echo -1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c 'echo 1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"
          sudo sh -c "echo ':APE-jart:M::jartsr::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"

      # The WebAssembly runtime of --target wasm32, as in build.yml (the
      # caches of main are shared).
      - name: Cache emsdk
        if: env.REUSE != '1' && env.REFUSED == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-checked

      - name: Cache OpenSSL for WebAssembly
        if: env.REUSE != '1' && env.REFUSED == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/wasm/openssl
          key: wasm-openssl-${{ env.OPENSSL_VERSION }}-emsdk-${{ env.EMSDK_VERSION }}

      # The SHA-256 of the inputs of the runtime (the step wasm_runtime_key
      # of scripts/steps.sh) for its cache key: a change of another step
      # of scripts/steps.sh keeps the key.
      - name: The inputs of the WebAssembly runtime
        if: env.REUSE != '1' && env.REFUSED == ''
        run: |
          k=$(sh scripts/steps.sh wasm_runtime_key)
          echo "WASM_RUNTIME_INPUTS=$k" >> "$GITHUB_ENV"
          # The keys of the caches of libpdfium.a, libvips and ccache.
          k=$(sh scripts/steps.sh cache_keys)
          echo "$k" >> "$GITHUB_ENV"

      # The WebAssembly runtime (about 3 minutes), with the key of build.yml.
      # The SHA-256 of its inputs has the NIFs of the runtime. The step
      # wasm_runtime keeps it only when that SHA-256 is the same, else it
      # builds it again.
      - name: Cache the WebAssembly runtime
        if: env.REUSE != '1' && env.REFUSED == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/wasm-runtime
          key: wasm-runtime-${{ env.OTP_VERSION }}-emsdk-${{ env.EMSDK_VERSION }}-${{ env.WASM_RUNTIME_INPUTS }}

      # The libraries of libvips, with those of each part (about 10
      # minutes). custom-build-caches.yml fills this cache and the next
      # ones on main. Their key is the SHA-256 of their recipe, so a new set
      # of parts builds only libvips (scripts/libvips.sh --deps-key).
      - name: The recipe of the libraries of libvips
        if: env.REUSE != '1' && env.REFUSED == '' && contains(env.EXTRA_NIFS, 'vix')
        run: |
          k=$(sh scripts/libvips.sh --deps-key)
          echo "LIBVIPS_DEPS_KEY=$k" >> "$GITHUB_ENV"

      - name: Cache the libraries of libvips
        if: env.REUSE != '1' && env.REFUSED == '' && contains(env.EXTRA_NIFS, 'vix')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/libvips-deps
          key: libvips-deps-cosmocc-${{ env.COSMOCC_VERSION }}-${{ env.LIBVIPS_DEPS_KEY }}

      # scripts/libvips.sh builds libvips for the NIF of vix with meson
      # (the version of the test of the recipe), ninja, and nasm (the SIMD
      # code of libjpeg-turbo).
      # The static libpdfium.a of each CPU for the NIF of ex_pdfium, with the
      # key of pdfium.yml. Without it, scripts/pdfium.sh checks out PDFium
      # (about 2 GB) and builds it (about 10 minutes for each CPU).
      - name: Cache libpdfium.a (x64)
        if: env.REUSE != '1' && env.REFUSED == '' && contains(env.EXTRA_NIFS, 'ex_pdfium')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/pdfium/x64
          key: libpdfium-x64-cosmocc-${{ env.COSMOCC_VERSION }}-${{ env.PDFIUM_INPUTS }}

      - name: Cache libpdfium.a (arm64)
        if: env.REUSE != '1' && env.REFUSED == '' && contains(env.EXTRA_NIFS, 'ex_pdfium')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/pdfium/arm64
          key: libpdfium-arm64-cosmocc-${{ env.COSMOCC_VERSION }}-${{ env.PDFIUM_INPUTS }}

      # ccache for the C and C++ compiles of cosmocc (CCACHE of
      # scripts/steps.sh), about 4 of the 7 minutes of OTP. One cache for
      # each OTP version, from the cache of an earlier version when it is
      # new: most of the files of a patch release do not change.
      - name: Install ccache
        if: env.REUSE != '1' && env.REFUSED == ''
        run: sudo apt-get install -y ccache

      - name: Cache ccache
        if: env.REUSE != '1' && env.REFUSED == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/ccache
          key: ccache-cosmocc-${{ env.COSMOCC_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ env.CCACHE_INPUTS }}
          restore-keys: |
            ccache-cosmocc-${{ env.COSMOCC_VERSION }}-otp-${{ env.OTP_VERSION }}-
            ccache-cosmocc-${{ env.COSMOCC_VERSION }}-otp-

      - name: Install meson
        if: env.REUSE != '1' && env.REFUSED == '' && contains(env.EXTRA_NIFS, 'vix')
        run: |
          python3 -m pip install --user meson==1.12.1
          sudo apt-get install -y ninja-build nasm

      # The store of prebuilt parts (docs/BUILDING.md, "The store of
      # parts"): the built OTP, Elixir and each NIF, in the files of the
      # prerelease "parts". The build takes each part of its choices from
      # it, and packs each part that it builds in PARTS_PUT. The step "Put
      # the new parts in the store" puts them there: the build has no
      # token.
      - name: Build
        if: env.REUSE != '1' && env.REFUSED == ''
        env:
          CC: cosmocc
          AR: cosmoar
          CCACHE: "1"
          PARTS_URL: https://github.com/${{ github.repository }}/releases/download/parts
          PARTS_PUT: ${{ runner.temp }}/parts-new
        run: |
          export OUT="$GITHUB_WORKSPACE/build/$OUT_NAME"
          build/cosmocc/bin/make
          CCACHE_DIR=build/ccache ccache -s

      # The step test of the Makefile: the file runs a program, and builds one
      # that runs (with SQLite and WebAssembly, when they are in it).
      # The same CC and AR as the build: else the settings of the Makefile
      # change, and make builds again from the first step.
      - name: Test
        if: env.REUSE != '1' && env.REFUSED == ''
        timeout-minutes: 5
        env:
          CC: cosmocc
          AR: cosmoar
        run: OUT="$GITHUB_WORKSPACE/build/$OUT_NAME" timeout 120 build/cosmocc/bin/make test

      - name: Check the file
        if: env.REUSE != '1' && env.REFUSED == ''
        run: |
          f="build/$OUT_NAME"
          "$f" --version
          # The runtime of --target wasm32 is in the zip.
          "$f" -noshell -eval 'case filelib:wildcard("/zip/lib/wasm_host-*/priv/runtime/beam.wasm") of [_] -> halt(); [] -> halt(1) end.' ||
            { echo "No WebAssembly runtime in the file" >&2; exit 1; }
          for n in $EXTRA_NIFS; do
            "$f" --version | grep -q "Linked NIFs.* $n-" || { echo "The NIF of $n is not linked" >&2; exit 1; }
          done
          if [ "$REBAR3" = 1 ]; then "$f" rebar3 version; fi
          if [ "$HEX" = 1 ]; then "$f" mix hex; fi
          for app in $OTP_APPS; do
            "$f" -noshell -eval "ok = application:load($app), halt()."
          done
          for app in $OTP_OMIT; do
            if "$f" -noshell -eval "ok = application:load($app), halt()." 2> /dev/null; then
              echo "The file has $app, which the request leaves out" >&2; exit 1
            fi
          done

      # The FIFO beam.com: the file goes to the prerelease custom-builds,
      # where the FIFO reads it. The cleanup deletes it after 30 days.
      # After the checks: a part of a build that failed does not go into
      # the store. A part that is there already (a build at the same
      # time) stays: the same name has the same inputs.
      - name: Put the new parts in the store
        if: env.REUSE != '1' && env.REFUSED == ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ runner.temp }}/parts-new
        run: |
          set -- "$NEW"/*.tar.xz
          [ -f "$1" ] || { echo "No new part"; exit 0; }
          gh release view parts --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create parts --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Prebuilt parts" --notes "The parts of the custom builds: docs/BUILDING.md, \"The store of parts\"." ||
            gh release view parts --repo "$GITHUB_REPOSITORY" > /dev/null
          for f in "$@"; do
            ls -l "$f"
            gh release upload parts "$f" --repo "$GITHUB_REPOSITORY" ||
              echo "The store did not take $(basename "$f") (it can be there already)"
          done

      - name: Put the file in the release
        if: github.event_name == 'workflow_dispatch' && env.REUSE != '1' && env.REFUSED == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/custom_build.py put "build/$OUT_NAME"

      - name: Upload
        id: upload
        if: github.event_name == 'issues'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.OUT_NAME }}-issue-${{ github.event.issue.number }}
          path: build/${{ env.OUT_NAME }}
          if-no-files-found: error

      - name: Answer the issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.artifact-url }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          {
            echo "The build is ready: [$OUT_NAME]($URL) (a zip with the file; the download needs a GitHub account, for 90 days)."
            echo
            echo "Erlang/OTP $OTP_VERSION. Elixir: $ELIXIR (version $ELIXIR_VERSION)."
            echo
            echo "OTP applications added: ${OTP_APPS:-none}. Hex: $HEX. rebar3: $REBAR3. More NIFs: ${EXTRA_NIFS:-none}. Elixir: $ELIXIR. JIT: $JIT. SQLite: $SQLITE. WebAssembly: $WASM."
            echo
            echo "Built from the commit $GITHUB_SHA of main, with the WebAssembly runtime of --target wasm32."
            echo
            echo "The run: $RUN"
          } > answer.md
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file answer.md
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Report a failure
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "The build failed: $RUN (the log has the reason). The issue stays open."

      # A build of a URL that did not run: a text with the reason goes in
      # the release for the day, so the FIFO gives it to the client and
      # does not ask for the build again.
      - name: Mark the URL
        if: always() && github.event_name == 'workflow_dispatch' && inputs.url != '' && (env.REFUSED != '' || failure())
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/custom_build.py mark "${REFUSED:-failed}"

      # The FIFO beam.com: the result goes to the FIFO, with the encrypted
      # address. The FIFO emails the link of the file, or the reason. A
      # build of a URL has no address: notify prints "No FIFO to notify".
      - name: Answer the FIFO beam.com
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          JOB_STATUS: ${{ job.status }}
          BEAM_FIFO_URL: ${{ vars.BEAM_FIFO_URL || 'https://mkfifo.com/beam.com' }}
          BEAM_FIFO_SECRET: ${{ secrets.BEAM_FIFO_SECRET }}
        run: |
          if [ -n "$REFUSED" ]; then
            python3 -I scripts/custom_build.py notify refused "$REFUSED"
          elif [ "$JOB_STATUS" = success ]; then
            python3 -I scripts/custom_build.py notify ready
          else
            python3 -I scripts/custom_build.py notify failed
          fi
