name: Publish the site

# The site of BEAM.com on GitHub Pages (docs/site.sh): Livebook in the
# page at the root (wasm/livebook/page.sh), with the documentation as its
# notebooks, the same documentation as static pages at docs/ (ExDoc), and
# the Erlang shell of examples/worker in the page at repl/. The release of
# Livebook (wasm/livebook/setup.sh) has the notebooks in it. It stays in
# the cache until its files, the pages or the versions of beam.com change.
# It uses the beam.com of main (the prerelease "edge"). It runs after each
# change of the pages on main, after each run of the build on main (a new
# edge), and by hand. Pages must use "GitHub Actions" as its source
# (Settings > Pages).
on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
      - "examples/worker/**"
      - "wasm/livebook/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Build and test BEAM.com"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One publish at a time; a newer one waits.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    name: Build and publish the site
    # After a build: only a successful push to main of this repository (the
    # branch filter of workflow_run also matches a "main" of a fork).
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download the edge beam.com
        id: edge
        run: |
          mkdir -p bin
          gh release download edge --repo "$GITHUB_REPOSITORY" --dir bin --pattern 'beam.com*'
          (cd bin && sha256sum -c beam.com.sha256)
          chmod +x bin/beam.com
          # The key of the cache of Livebook: the versions of OTP and Elixir.
          echo "versions=$(bin/beam.com --version | grep -E "Erlang/OTP|Elixir" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Cache the release of Livebook
        id: livebook
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            livebook-build/livebook/_build/prod/rel/livebook
            livebook-build/cacert.pem
          key: livebook-${{ steps.edge.outputs.versions }}-${{ hashFiles('wasm/livebook/setup.sh', 'wasm/livebook/livebook.patch', 'docs/notebooks/**', 'README.md', 'CONTRIBUTING.md', 'SECURITY.md', 'docs/*.md', 'docs/history/*.md') }}

      - name: Build the release of Livebook
        if: steps.livebook.outputs.cache-hit != 'true'
        run: BEAM_COM="$PWD/bin/beam.com" sh wasm/livebook/setup.sh "$PWD/livebook-build"

      - name: Build the site
        run: LIVEBOOK_DIR="$PWD/livebook-build" sh docs/site.sh bin/beam.com site

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4