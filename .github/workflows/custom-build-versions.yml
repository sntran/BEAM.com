name: Versions of the custom builds

# Each pair of an Erlang/OTP version and an Elixir version that a custom
# build can use (OTP_VERSIONS and ELIXIR_VERSIONS of
# scripts/custom_build.py), except the pair of the defaults, which
# build.yml tests. Each job builds beam.com with the default choices of a
# custom build and runs the step test. Run it when a version goes into a
# table, or when a patch of OTP or Elixir changes.
#
# A run on main also fills the caches of main for each OTP version (ccache
# and the WebAssembly runtime), which custom-build.yml reads: after a new
# version, its first custom build does not start cold. The caches of a
# pull request are only for that pull request.
on:
  push:
    branches: [main]
    paths:
      - scripts/custom_build.py
      - patches/otp/**
      - patches/elixir/**
      - .github/workflows/custom-build-versions.yml
  pull_request:
    paths:
      - scripts/custom_build.py
      - patches/otp/**
      - patches/elixir/**
      - .github/workflows/custom-build-versions.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-build-versions-${{ github.ref }}
  cancel-in-progress: true

env:
  COSMOCC_VERSION: "4.0.2"
  OPENSSL_VERSION: "4.0.3"
  EMSDK_VERSION: "6.0.10"

jobs:
  pairs:
    name: The pairs of versions
    runs-on: ubuntu-26.04
    outputs:
      pairs: ${{ steps.pairs.outputs.pairs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The defaults of scripts/steps.sh must be in the tables, with the
      # same commits.
      - id: pairs
        run: |
          python3 -I scripts/custom_build.py versions > versions.json
          python3 -I -c 'import json; print("pairs=" + json.dumps(json.load(open("versions.json"))["pairs"]))' >> "$GITHUB_OUTPUT"

      # The patches of beam.com apply to each version.
      - name: The patches
        run: |
          python3 -I -c 'import json; d = json.load(open("versions.json")); [print("otp", v, c) for v, c in d["otp"].items()]; [print("elixir", v, c) for v, c in d["elixir"].items()]' |
          while read -r kind v c; do
            if [ "$kind" = otp ]; then
              url=https://github.com/erlang/otp.git tag=OTP-$v patches=patches/otp
            else
              url=https://github.com/elixir-lang/elixir.git tag=v$v patches=patches/elixir
            fi
            git clone -q --depth 1 --branch "$tag" "$url" "src-$tag"
            [ "$(git -C "src-$tag" rev-parse HEAD)" = "$c" ] || { echo "$tag is not the commit $c" >&2; exit 1; }
            for p in "$patches"/*.patch; do
              git -C "src-$tag" apply --check "$GITHUB_WORKSPACE/$p" || { echo "$p does not apply to $tag" >&2; exit 1; }
            done
            echo "$tag: the commit and the patches are correct"
            rm -rf "src-$tag"
          done

  build:
    name: OTP ${{ matrix.otp }}, Elixir ${{ matrix.elixir }}
    needs: pairs
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pairs.outputs.pairs) }}
    env:
      OTP_VERSION: ${{ matrix.otp }}
      OTP_COMMIT: ${{ matrix.otp_commit }}
      ELIXIR_VERSION: ${{ matrix.elixir }}
      ELIXIR_COMMIT: ${{ matrix.elixir_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache cosmocc
        id: cache_cosmocc
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/cosmocc
          key: cosmocc-${{ env.COSMOCC_VERSION }}-checked

      - name: Download cosmocc
        run: make toolchain

      - name: Cache OpenSSL
        id: cache_openssl
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-cosmocc-${{ env.COSMOCC_VERSION }}-cosmocc

      - name: Register the APE loader
        run: |
          sudo cp build/cosmocc/bin/ape-x86_64.elf /usr/bin/ape
          sudo sh -c 'echo -1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c 'echo 1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"
          sudo sh -c "echo ':APE-jart:M::jartsr::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"

      - name: Cache emsdk
        id: cache_emsdk
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-checked

      - name: Cache OpenSSL for WebAssembly
        id: cache_openssl_for_webassembly
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/wasm/openssl
          key: wasm-openssl-${{ env.OPENSSL_VERSION }}-emsdk-${{ env.EMSDK_VERSION }}

      # The SHA-256 of the inputs of the runtime (the step wasm_runtime_key
      # of scripts/steps.sh) for its cache key: a change of another step
      # of scripts/steps.sh keeps the key.
      - name: The inputs of the WebAssembly runtime
        run: |
          k=$(sh scripts/steps.sh wasm_runtime_key)
          echo "WASM_RUNTIME_INPUTS=$k" >> "$GITHUB_ENV"
          # The keys of the caches of libpdfium.a, libvips and ccache.
          k=$(sh scripts/steps.sh cache_keys)
          echo "$k" >> "$GITHUB_ENV"

      # The key of build.yml and custom-build.yml.
      - name: Cache the WebAssembly runtime
        id: cache_the_webassembly_runtime
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/wasm-runtime
          key: wasm-runtime-${{ env.OTP_VERSION }}-emsdk-${{ env.EMSDK_VERSION }}-${{ env.WASM_RUNTIME_INPUTS }}

      # ccache for the C and C++ compiles of cosmocc (CCACHE of
      # scripts/steps.sh), about 4 of the 7 minutes of OTP. One cache for
      # each OTP version, from the cache of an earlier version when it is
      # new: most of the files of a patch release do not change.
      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Cache ccache
        id: cache_ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/ccache
          key: ccache-cosmocc-${{ env.COSMOCC_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ env.CCACHE_INPUTS }}
          restore-keys: |
            ccache-cosmocc-${{ env.COSMOCC_VERSION }}-otp-${{ env.OTP_VERSION }}-
            ccache-cosmocc-${{ env.COSMOCC_VERSION }}-otp-

      # The default choices of a custom build.
      - name: Build
        env:
          CC: cosmocc
          AR: cosmoar
          CCACHE: "1"
        run: |
          build/cosmocc/bin/make
          CCACHE_DIR=build/ccache ccache -s

      - name: Test
        timeout-minutes: 5
        env:
          CC: cosmocc
          AR: cosmoar
        run: timeout 120 build/cosmocc/bin/make test

      - name: Check the versions
        run: |
          build/beam.com --version | tee version.txt
          grep -q "Erlang/OTP  : $OTP_VERSION\$" version.txt
          grep -q "Elixir      : $ELIXIR_VERSION\$" version.txt
          build/beam.com -noshell -eval 'io:format("~s~n", [erlang:system_info(otp_release)]), halt().'
          unzip -p build/beam.com licenses/NOTICE | grep -q "^Erlang/OTP $OTP_VERSION ("
          unzip -p build/beam.com licenses/NOTICE | grep -q "^Elixir $ELIXIR_VERSION ("
          build/beam.com elixir -e 'IO.puts(System.version())' | tee elixir.txt
          grep -qx "$ELIXIR_VERSION" elixir.txt

      # The saves of the caches of this job. A pull request only reads
      # the caches, so it does not push out the caches of main (GitHub
      # keeps 10 GB of caches for each repository).
      - name: Save the cache of cosmocc
        if: github.event_name != 'pull_request' && steps.cache_cosmocc.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/cosmocc
          key: ${{ steps.cache_cosmocc.outputs.cache-primary-key }}

      - name: Save the cache of OpenSSL
        if: github.event_name != 'pull_request' && steps.cache_openssl.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/openssl
          key: ${{ steps.cache_openssl.outputs.cache-primary-key }}

      - name: Save the cache of emsdk
        if: github.event_name != 'pull_request' && steps.cache_emsdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/emsdk
          key: ${{ steps.cache_emsdk.outputs.cache-primary-key }}

      - name: Save the cache of OpenSSL for WebAssembly
        if: github.event_name != 'pull_request' && steps.cache_openssl_for_webassembly.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/wasm/openssl
          key: ${{ steps.cache_openssl_for_webassembly.outputs.cache-primary-key }}

      - name: Save the cache of the WebAssembly runtime
        if: github.event_name != 'pull_request' && steps.cache_the_webassembly_runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/wasm-runtime
          key: ${{ steps.cache_the_webassembly_runtime.outputs.cache-primary-key }}

      - name: Save the cache of ccache
        if: github.event_name != 'pull_request' && steps.cache_ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/ccache
          key: ${{ steps.cache_ccache.outputs.cache-primary-key }}
