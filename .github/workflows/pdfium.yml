name: PDFium with cosmocc

# libpdfium.a built with cosmocc for x86_64 and aarch64
# (scripts/pdfium.sh), for the NIF of ex_pdfium. The checkout of PDFium
# (depot_tools, about 2 GB) stays in the cache.
on:
  push:
    branches: [feat/pdfium]
  pull_request:
    paths:
      - scripts/pdfium.sh
      - patches/pdfium/**
      - .github/workflows/pdfium.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdfium-${{ github.ref }}
  cancel-in-progress: true

env:
  COSMOCC_VERSION: "4.0.2"

jobs:
  build:
    name: libpdfium.a for ${{ matrix.cpu }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cpu: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache cosmocc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/cosmocc
          key: cosmocc-${{ env.COSMOCC_VERSION }}-checked

      - name: Download cosmocc
        run: make toolchain

      # The tools of cosmocc are APE files, which ninja starts.
      - name: Register the APE loader
        run: |
          sudo cp build/cosmocc/bin/ape-x86_64.elf /usr/bin/ape
          sudo sh -c 'echo -1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c 'echo 1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"
          sudo sh -c "echo ':APE-jart:M::jartsr::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"

      - name: Cache the checkout of PDFium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/pdfium-src
          key: pdfium-src-7881-${{ matrix.cpu }}-v1

      - name: Build
        env:
          PDFIUM_KEEP_GOING: "1"
        run: |
          set -o pipefail
          sh scripts/pdfium.sh ${{ matrix.cpu }} build/pdfium/${{ matrix.cpu }} 2>&1 | tee build/pdfium-${{ matrix.cpu }}.log

      - name: The errors
        if: failure()
        run: |
          grep -E '^FAILED: |error: |Error: ' build/pdfium-${{ matrix.cpu }}.log | sort | uniq -c | sort -rn | head -150 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pdfium-${{ matrix.cpu }}
          path: |
            build/pdfium-${{ matrix.cpu }}.log
            build/pdfium/${{ matrix.cpu }}
          if-no-files-found: warn
