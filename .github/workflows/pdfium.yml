name: PDFium with cosmocc

# libpdfium.a built with cosmocc for x86_64 and aarch64
# (scripts/pdfium.sh), for the NIF of ex_pdfium. The checkout of PDFium
# (depot_tools, about 2 GB) stays in the cache.
#
# Then a beam.com with EXTRA_NIFS=ex_pdfium and these libraries, and
# tests/programs/ex_pdfium_check made with it: its check and its times on
# each system.
on:
  push:
    branches: [feat/pdfium]
  pull_request:
    paths:
      - scripts/pdfium.sh
      - patches/pdfium/**
      - tests/programs/ex_pdfium_check/**
      - .github/workflows/pdfium.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdfium-${{ github.ref }}
  cancel-in-progress: true

env:
  OTP_VERSION: "29.1.1"
  COSMOCC_VERSION: "4.0.2"
  OPENSSL_VERSION: "4.0.3"

jobs:
  build:
    name: libpdfium.a for ${{ matrix.cpu }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cpu: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache cosmocc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/cosmocc
          key: cosmocc-${{ env.COSMOCC_VERSION }}-checked

      - name: Download cosmocc
        run: make toolchain

      # The tools of cosmocc are APE files, which ninja starts.
      - name: Register the APE loader
        run: |
          sudo cp build/cosmocc/bin/ape-x86_64.elf /usr/bin/ape
          sudo sh -c 'echo -1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c 'echo 1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"
          sudo sh -c "echo ':APE-jart:M::jartsr::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"

      - name: Cache the checkout of PDFium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/pdfium-src
          key: pdfium-src-7881-${{ matrix.cpu }}-small-v1

      - name: Build
        env:
          PDFIUM_KEEP_GOING: "1"
        run: |
          set -o pipefail
          sh scripts/pdfium.sh ${{ matrix.cpu }} build/pdfium/${{ matrix.cpu }} 2>&1 | tee build/pdfium-${{ matrix.cpu }}.log

      - name: The errors
        if: failure()
        run: |
          grep -E '^FAILED: |error: |Error: ' build/pdfium-${{ matrix.cpu }}.log | sort | uniq -c | sort -rn | head -150 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pdfium-${{ matrix.cpu }}
          path: |
            build/pdfium-${{ matrix.cpu }}.log
            build/pdfium/${{ matrix.cpu }}
          if-no-files-found: warn

  nif:
    name: Build with ex_pdfium
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache cosmocc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/cosmocc
          key: cosmocc-${{ env.COSMOCC_VERSION }}-checked

      - name: Download cosmocc
        run: make toolchain

      - name: Cache OpenSSL
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-cosmocc-${{ env.COSMOCC_VERSION }}-cosmocc

      - name: Register the APE loader
        run: |
          sudo cp build/cosmocc/bin/ape-x86_64.elf /usr/bin/ape
          sudo sh -c 'echo -1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c 'echo 1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"
          sudo sh -c "echo ':APE-jart:M::jartsr::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"

      # The libpdfium.a of the job build: build/pdfium/x64 and arm64.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: pdfium-*
          path: build
          merge-multiple: true

      # No SQLite, WAMR or WebAssembly runtime: only what ex_pdfium_check
      # needs.
      - name: Build
        env:
          CC: cosmocc
          AR: cosmoar
        run: |
          ls -l build/pdfium/x64/libpdfium.a build/pdfium/arm64/libpdfium.a
          build/cosmocc/bin/make ELIXIR=1 SQLITE=0 WASM=0 WASM_RUNTIME=none \
            EXTRA_NIFS=ex_pdfium PDFIUM="$PWD/build/pdfium" bundle
          build/beam.com --version | tee version.txt
          grep -q 'Linked NIFs.* ex_pdfium-' version.txt

      - name: Make ex_pdfium_check.com
        run: |
          build/beam.com tests/programs/ex_pdfium_check -o build/ex_pdfium_check.com
          build/ex_pdfium_check.com
          ls -l build/beam.com build/ex_pdfium_check.com

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ex_pdfium_check
          path: build/ex_pdfium_check.com
          if-no-files-found: error

  nif-run:
    name: ex_pdfium on ${{ matrix.name }}
    needs: nif
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-26.04 }
          - { name: Linux aarch64, os: ubuntu-24.04-arm }
          - { name: macOS arm64, os: macos-latest }
          - { name: macOS x86_64, os: macos-15-intel }
          - { name: Windows x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ex_pdfium_check

      # An artifact loses the execute bit. sh starts the APE file where the
      # kernel cannot.
      - name: Check and times (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x ex_pdfium_check.com
          sh ./ex_pdfium_check.com | tee check.txt
          grep -q '^ex_pdfium_check: ok$' check.txt
          sh ./ex_pdfium_check.com bench 5 | tee bench.txt
          { echo "### ex_pdfium: ${{ matrix.name }}"; echo; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Check and times (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item ex_pdfium_check.com ex_pdfium_check.exe
          ./ex_pdfium_check.exe | Tee-Object check.txt
          if (-not (Select-String -Path check.txt -Pattern '^ex_pdfium_check: ok$' -Quiet)) { exit 1 }
          ./ex_pdfium_check.exe bench 5 | Tee-Object bench.txt
          "### ex_pdfium: ${{ matrix.name }}`n`n``````n$(Get-Content bench.txt -Raw)``````" | Out-File -Append $env:GITHUB_STEP_SUMMARY
