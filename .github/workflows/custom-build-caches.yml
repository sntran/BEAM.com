name: Caches of the custom builds

# Fills the caches of main that custom-build.yml reads, so a custom build
# does not start cold: the libraries of libvips and libvips (about 13
# minutes), ccache for OTP (about 4 minutes), libpdfium.a (about 20
# minutes) and the WebAssembly runtime (about 3 minutes). Only a run on
# main fills them: the caches of a pull request are only for that pull
# request, and vix.yml runs only on pull requests.
#
# It builds beam.com with the choices of a custom build of the form, with
# the default NIFs and each heavy NIF: vix with all its parts, ex_pdfium
# and rusty_csv. scripts/custom_build.py makes the settings, so the
# versions and the cache keys are those of custom-build.yml. A custom
# build with fewer parts of vix builds only libvips (about 1.5 minutes).
#
# GitHub removes a cache that no run reads for 7 days. The schedule reads
# each cache two times each week. When each cache is there with its key,
# the job builds nothing.
on:
  push:
    branches: [main]
    paths:
      - scripts/libvips.sh
      - patches/libvips/**
      - c_src/vips/**
      - scripts/pdfium.sh
      - patches/pdfium/**
      - patches/otp/**
      - c_src/cosmo/**
      - scripts/custom_build.py
      - .github/workflows/custom-build-caches.yml
  schedule:
    - cron: "17 4 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-build-caches
  cancel-in-progress: false

env:
  COSMOCC_VERSION: "4.0.2"
  OPENSSL_VERSION: "4.0.3"
  EMSDK_VERSION: "6.0.10"

jobs:
  caches:
    name: Fill the caches
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The inputs of workflow_dispatch of custom-build.yml, as the form of
      # mkfifo.com sends them, with the default NIFs and each heavy NIF.
      - name: The choices of a custom build
        env:
          INPUT_HEX: "0"
          INPUT_REBAR3: "0"
          INPUT_ELIXIR: "1"
          INPUT_JIT: "1"
          INPUT_SQLITE: "1"
          INPUT_WASM: "1"
          INPUT_NIFS: default exqlite bcrypt_elixir argon2_elixir vix vix-avif vix-gif vix-icc vix-svg ex_pdfium rusty_csv
        run: python3 -I scripts/custom_build.py dispatch "$GITHUB_SHA"

      # The steps and the keys of custom-build.yml, from "Cache cosmocc" to
      # "Install meson". Keep them the same.
      - name: Cache cosmocc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/cosmocc
          key: cosmocc-${{ env.COSMOCC_VERSION }}-checked

      - name: Download cosmocc
        run: make toolchain

      - name: Cache OpenSSL
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-cosmocc-${{ env.COSMOCC_VERSION }}-cosmocc

      - name: Register the APE loader
        run: |
          sudo cp build/cosmocc/bin/ape-x86_64.elf /usr/bin/ape
          sudo sh -c 'echo -1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c 'echo 1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"
          sudo sh -c "echo ':APE-jart:M::jartsr::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"

      - name: Cache emsdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-checked

      - name: Cache OpenSSL for WebAssembly
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/wasm/openssl
          key: wasm-openssl-${{ env.OPENSSL_VERSION }}-emsdk-${{ env.EMSDK_VERSION }}

      - name: The inputs of the WebAssembly runtime
        run: |
          k=$(sh scripts/steps.sh wasm_runtime_key)
          echo "WASM_RUNTIME_INPUTS=$k" >> "$GITHUB_ENV"

      - name: Cache the WebAssembly runtime
        id: wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/wasm-runtime
          key: wasm-runtime-${{ env.OTP_VERSION }}-emsdk-${{ env.EMSDK_VERSION }}-${{ env.WASM_RUNTIME_INPUTS }}

      - name: The recipe of the libraries of libvips
        run: |
          k=$(sh scripts/libvips.sh --deps-key)
          echo "LIBVIPS_DEPS_KEY=$k" >> "$GITHUB_ENV"

      - name: Cache the libraries of libvips
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/libvips-deps
          key: libvips-deps-cosmocc-${{ env.COSMOCC_VERSION }}-${{ env.LIBVIPS_DEPS_KEY }}

      - name: Cache libvips
        id: libvips
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/libvips
          key: libvips-cosmocc-${{ env.COSMOCC_VERSION }}-${{ hashFiles('scripts/libvips.sh', 'patches/libvips/**', 'c_src/vips/**') }}-parts-${{ env.VIX_PARTS }}

      - name: Cache libpdfium.a (x64)
        id: pdfium_x64
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/pdfium/x64
          key: libpdfium-x64-cosmocc-${{ env.COSMOCC_VERSION }}-${{ hashFiles('scripts/pdfium.sh', 'patches/pdfium/**') }}

      - name: Cache libpdfium.a (arm64)
        id: pdfium_arm64
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/pdfium/arm64
          key: libpdfium-arm64-cosmocc-${{ env.COSMOCC_VERSION }}-${{ hashFiles('scripts/pdfium.sh', 'patches/pdfium/**') }}

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Cache ccache
        id: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/ccache
          key: ccache-cosmocc-${{ env.COSMOCC_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ hashFiles('patches/otp/**', 'c_src/cosmo/**') }}
          restore-keys: |
            ccache-cosmocc-${{ env.COSMOCC_VERSION }}-otp-${{ env.OTP_VERSION }}-
            ccache-cosmocc-${{ env.COSMOCC_VERSION }}-otp-

      # A cache that is there with its key does not change, so the job
      # builds only when one is not.
      - name: Find a missing cache
        env:
          HITS: >-
            ${{ steps.wasm.outputs.cache-hit }} ${{ steps.deps.outputs.cache-hit }}
            ${{ steps.libvips.outputs.cache-hit }} ${{ steps.pdfium_x64.outputs.cache-hit }}
            ${{ steps.pdfium_arm64.outputs.cache-hit }} ${{ steps.ccache.outputs.cache-hit }}
        # A missing cache gives an empty value or false.
        run: |
          set -- $HITS
          if [ "$*" = "true true true true true true" ]; then
            echo "Each cache is there with its key: no build."
          else
            echo "A cache is missing (cache-hit: $HITS)."
            echo "BUILD_NEEDED=1" >> "$GITHUB_ENV"
          fi

      - name: Install meson
        if: env.BUILD_NEEDED == '1'
        run: |
          python3 -m pip install --user meson==1.12.1
          sudo apt-get install -y ninja-build nasm

      # The build of custom-build.yml. The post steps of the caches save
      # each cache that was missing, when the job ends with no error.
      - name: Build
        if: env.BUILD_NEEDED == '1'
        env:
          CC: cosmocc
          AR: cosmoar
          CCACHE: "1"
        run: |
          build/cosmocc/bin/make
          CCACHE_DIR=build/ccache ccache -s

      - name: Check the file
        if: env.BUILD_NEEDED == '1'
        run: |
          build/beam.com --version | tee version.txt
          grep -q 'Linked NIFs.* vix-' version.txt
          grep -q 'Linked NIFs.* ex_pdfium-' version.txt
