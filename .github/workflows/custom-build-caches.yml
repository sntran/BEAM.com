name: Caches and parts of the custom builds

# Fills the store of parts and the caches of main that custom-build.yml
# reads, so a custom build does not start cold.
#
# - The store of parts (docs/BUILDING.md, "The store of parts"): the
#   built OTP (about 7 minutes), Elixir (about 1 minute) and each NIF
#   (vix with its libraries about 15 minutes, ex_pdfium with libpdfium.a
#   about 21 minutes). A part does not expire.
# - The caches, for a part that is not in the store yet: the libraries of
#   libvips (about 13 minutes), ccache for OTP (about 4 minutes),
#   libpdfium.a (about 20 minutes) and the WebAssembly runtime (about 3
#   minutes). Only a run on main fills them: the caches of a pull request
#   are only for that pull request, and vix.yml runs only on pull
#   requests.
#
# It builds beam.com with the choices of a custom build of the form, with
# the default NIFs and each heavy NIF: vix with all its parts, ex_pdfium
# and rusty_csv. scripts/custom_build.py makes the settings, so the
# versions and the keys are those of custom-build.yml. A custom build with
# other parts of vix builds only libvips and the NIF (about 3 minutes).
#
# GitHub removes a cache that no run reads for 7 days. The schedule reads
# each cache each day. When the store has each part, the build takes
# about one minute.
#
# Then the job urls builds again each build URL of the FIFO beam.com
# (beam-u.URL.com) whose source changed, with the parts of the store. The
# old file stays until its new build replaces it, so a request never
# waits for a build after a push.
#
# A push starts the workflow when it changes a path of the source of a
# build: paths-ignore has the paths of NOT_SOURCE of
# scripts/custom_build.py, and the Markdown files at the top
# (tests/custom_build_test.py checks it). A push that changes only
# scripts/custom_build.py starts it too, because that file makes the
# settings of a build.
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - .github
      - .github/**
      - .formatter.exs
      - .formatter.exs/**
      - .gitignore
      - .gitignore/**
      - docs
      - docs/**
      - examples
      - examples/**
      - js
      - js/**
      - lib
      - lib/**
      - mix.exs
      - mix.exs/**
      - mix.lock
      - mix.lock/**
      - package.json
      - package.json/**
      - priv/seeds
      - priv/seeds/**
      - specs
      - specs/**
      - tests
      - tests/**
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  # For the new parts in the release "parts" (the step after the build).
  # The checkout keeps no token, so the build cannot use it.
  contents: write
  # For the list of the caches (the last step).
  actions: read

concurrency:
  group: custom-build-caches
  cancel-in-progress: false

env:
  COSMOCC_VERSION: "4.0.2"
  OPENSSL_VERSION: "4.0.3"
  EMSDK_VERSION: "6.0.10"

jobs:
  caches:
    name: Fill the parts and the caches
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The inputs of workflow_dispatch of custom-build.yml, as the form of
      # mkfifo.com sends them, with the default NIFs and each heavy NIF.
      - name: The choices of a custom build
        env:
          INPUT_HEX: "0"
          INPUT_REBAR3: "0"
          INPUT_ELIXIR: "1"
          INPUT_JIT: "1"
          INPUT_SQLITE: "1"
          INPUT_WASM: "1"
          INPUT_NIFS: default exqlite bcrypt_elixir argon2_elixir vix vix-avif vix-gif vix-icc vix-svg ex_pdfium rusty_csv
        run: python3 -I scripts/custom_build.py dispatch "$GITHUB_SHA"

      # The steps and the keys of custom-build.yml, from "Cache cosmocc" to
      # "Install meson". Keep them the same.
      - name: Cache cosmocc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/cosmocc
          key: cosmocc-${{ env.COSMOCC_VERSION }}-checked

      - name: Download cosmocc
        run: make toolchain

      - name: Cache OpenSSL
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-cosmocc-${{ env.COSMOCC_VERSION }}-cosmocc

      - name: Register the APE loader
        run: |
          sudo cp build/cosmocc/bin/ape-x86_64.elf /usr/bin/ape
          sudo sh -c 'echo -1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c 'echo 1 > /proc/sys/fs/binfmt_misc/status' || true
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"
          sudo sh -c "echo ':APE-jart:M::jartsr::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"

      - name: Cache emsdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-checked

      - name: Cache OpenSSL for WebAssembly
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/wasm/openssl
          key: wasm-openssl-${{ env.OPENSSL_VERSION }}-emsdk-${{ env.EMSDK_VERSION }}

      - name: The inputs of the WebAssembly runtime
        run: |
          k=$(sh scripts/steps.sh wasm_runtime_key)
          echo "WASM_RUNTIME_INPUTS=$k" >> "$GITHUB_ENV"
          # The keys of the caches of libpdfium.a, libvips and ccache.
          k=$(sh scripts/steps.sh cache_keys)
          echo "$k" >> "$GITHUB_ENV"

      - name: Cache the WebAssembly runtime
        id: wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/wasm-runtime
          key: wasm-runtime-${{ env.OTP_VERSION }}-emsdk-${{ env.EMSDK_VERSION }}-${{ env.WASM_RUNTIME_INPUTS }}

      - name: The recipe of the libraries of libvips
        run: |
          k=$(sh scripts/libvips.sh --deps-key)
          echo "LIBVIPS_DEPS_KEY=$k" >> "$GITHUB_ENV"

      - name: Cache the libraries of libvips
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/libvips-deps
          key: libvips-deps-cosmocc-${{ env.COSMOCC_VERSION }}-${{ env.LIBVIPS_DEPS_KEY }}

      - name: Cache libpdfium.a (x64)
        id: pdfium_x64
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/pdfium/x64
          key: libpdfium-x64-cosmocc-${{ env.COSMOCC_VERSION }}-${{ env.PDFIUM_INPUTS }}

      - name: Cache libpdfium.a (arm64)
        id: pdfium_arm64
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/pdfium/arm64
          key: libpdfium-arm64-cosmocc-${{ env.COSMOCC_VERSION }}-${{ env.PDFIUM_INPUTS }}

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Cache ccache
        id: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/ccache
          key: ccache-cosmocc-${{ env.COSMOCC_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ env.CCACHE_INPUTS }}
          restore-keys: |
            ccache-cosmocc-${{ env.COSMOCC_VERSION }}-otp-${{ env.OTP_VERSION }}-
            ccache-cosmocc-${{ env.COSMOCC_VERSION }}-otp-

      - name: Install meson
        run: |
          python3 -m pip install --user meson==1.12.1
          sudo apt-get install -y ninja-build nasm

      # The build of custom-build.yml, with the store. The post steps of
      # the caches save each cache that was missing, when the job ends
      # with no error.
      - name: Build
        env:
          CC: cosmocc
          AR: cosmoar
          CCACHE: "1"
          PARTS_URL: https://github.com/${{ github.repository }}/releases/download/parts
          PARTS_PUT: ${{ runner.temp }}/parts-new
        run: |
          build/cosmocc/bin/make
          CCACHE_DIR=build/ccache ccache -s
          # The key of each part, for the log.
          sh scripts/steps.sh part_keys

      - name: Check the file
        run: |
          build/beam.com --version | tee version.txt
          grep -q 'Linked NIFs.* vix-' version.txt
          grep -q 'Linked NIFs.* ex_pdfium-' version.txt

      # As in custom-build.yml: after the checks, so a part of a build
      # that failed does not go into the store.
      - name: Put the new parts in the store
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ runner.temp }}/parts-new
        run: |
          set -- "$NEW"/*.tar.xz
          [ -f "$1" ] || { echo "No new part"; exit 0; }
          gh release view parts --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create parts --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Prebuilt parts" --notes "The parts of the custom builds: docs/BUILDING.md, \"The store of parts\"." ||
            gh release view parts --repo "$GITHUB_REPOSITORY" > /dev/null
          for f in "$@"; do
            ls -l "$f"
            gh release upload parts "$f" --repo "$GITHUB_REPOSITORY" ||
              echo "The store did not take $(basename "$f") (it can be there already)"
          done

      # The use of the 10 GB of caches of the repository, and the largest
      # caches, for a person who looks for the cause of a missing cache.
      - name: The caches of the repository
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" \
            --jq '"\(.active_caches_count) caches, \(.active_caches_size_in_bytes / 1048576 | floor) MB"'
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 40 --sort size_in_bytes --order desc

  # The builds of a URL of the FIFO beam.com (beam-u.URL.com) of an older
  # source: a new build of each one, one at a time, through
  # custom-build.yml with the input rebuild. Each run builds only when the
  # KEY of its source is not the KEY of beam-u.URL.com.json, and its new
  # file replaces the old one. At most custom_build.py REBUILD_DAILY new
  # builds of the day: the next run (each day) does the rest.
  urls:
    name: New builds of the URLs
    needs: caches
    runs-on: ubuntu-26.04
    # The wait for each build of custom-build.yml.
    timeout-minutes: 330
    permissions:
      # The delete of the marks.
      contents: write
      # The dispatch of custom-build.yml, and the list of its runs.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A mark stops the builds of a URL for the day (custom_build.py
      # url_mark). After a push, a build that did not run can run again.
      - name: Delete the marks of the URLs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/custom_build.py delete-marks

      - name: Build the URLs again
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/custom_build.py rebuild-urls "$GITHUB_SHA"
