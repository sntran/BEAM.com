name: A custom build of beam.com
description: A beam.com with other OTP applications, Hex, rebar3, or without parts. CI builds it and attaches it to this issue.
title: "Custom build"
labels: [custom-build]
body:
  - type: markdown
    attributes:
      value: |
        A maintainer starts the build: CI builds at once for an issue of a member of the repository, and for another issue when a maintainer adds the label custom-build again. CI builds beam.com with these choices, puts the file on this issue (a download of the run, for 90 days, with a GitHub account), and closes the issue. The build takes about 30 to 50 minutes. The file is built from the main branch, with the WebAssembly runtime of --target wasm32.

        The default beam.com has kernel, stdlib, sasl, compiler, parsetools, crypto, asn1, public_key, ssl, inets, ssh, xmerl, runtime_tools and tools, and Elixir with its tools.
  - type: dropdown
    id: otp_version
    attributes:
      label: Erlang/OTP version
      description: The versions that the patches of beam.com apply to (OTP_VERSIONS of scripts/custom_build.py).
      options:
        - 29.1.1 (default)
        - 29.1.2
        - 29.0.6
      default: 0
    validations:
      required: true
  - type: checkboxes
    id: otp_omit
    attributes:
      label: Leave out default OTP applications
      description: A smaller file. kernel, stdlib, sasl, compiler and crypto always stay. ssl needs public_key, and public_key needs asn1. Hex and rebar3 need inets and ssl, as do the downloads of packages by beam.com.
      options:
        - label: parsetools (leex and yecc)
        - label: asn1
        - label: public_key
        - label: ssl
        - label: inets (httpc)
        - label: ssh
        - label: xmerl
        - label: runtime_tools
        - label: tools (cover, for mix test --cover)
  - type: checkboxes
    id: otp_apps
    attributes:
      label: More OTP applications
      description: Their Erlang code. The C code of an application (as the port programs of os_mon) is not built.
      options:
        - label: mnesia
        - label: os_mon
        - label: eldap
        - label: ftp
        - label: tftp
        - label: diameter
        - label: eunit
        - label: common_test
        - label: syntax_tools
        - label: edoc
  - type: input
    id: other_apps
    attributes:
      label: Other OTP applications
      description: Names of OTP applications, with spaces (for example "snmp megaco").
  - type: checkboxes
    id: tools
    attributes:
      label: Tools
      options:
        - label: Hex (for mix.com; needs Elixir)
        - label: rebar3 (the tool rebar3.com, and for the rebar3 dependencies of mix.com)
  - type: checkboxes
    id: nifs
    attributes:
      label: More NIFs
      description: NIFs of hex.pm packages, linked into beam.com (needs Elixir). The default beam.com has those of exqlite, bcrypt_elixir and argon2_elixir.
      options:
        - label: picosat_elixir (for Ash)
        - label: vix (libvips, for the image package; about 13 MB more; not in the WebAssembly runtime)
        - label: rusty_csv (CSV, a NIF of Rust; about 1.3 MB more; not in the WebAssembly runtime)
        - label: ex_pdfium (PDF documents with PDFium, a NIF of Rust; about 19 MB more; not in the WebAssembly runtime)
  - type: dropdown
    id: elixir
    attributes:
      label: Elixir
      options:
        - "Yes"
        - "No"
      default: 0
    validations:
      required: true
  - type: dropdown
    id: elixir_version
    attributes:
      label: Elixir version
      description: Only for Elixir "Yes" (ELIXIR_VERSIONS of scripts/custom_build.py).
      options:
        - 1.20.4 (default)
        - 1.20.5
      default: 0
    validations:
      required: true
  - type: dropdown
    id: emulator
    attributes:
      label: Emulator
      options:
        - JIT (beam.com)
        - Interpreter (beam-emu.com)
      default: 0
    validations:
      required: true
  - type: dropdown
    id: sqlite
    attributes:
      label: SQLite
      options:
        - "Yes"
        - "No"
      default: 0
    validations:
      required: true
  - type: dropdown
    id: wasm
    attributes:
      label: WebAssembly (WAMR)
      options:
        - "Yes"
        - "No"
      default: 0
    validations:
      required: true
