<!doctype html>
<meta charset="utf-8">
<title>Erlang in the browser</title>
<!-- The Worker variant of wasm/erts (kernel and stdlib in the module) in a
     page: erl -eval, with the green threads on JSPI. Serve beam.mjs and
     beam.wasm of wasm/erts/build/worker next to this file. -->
<pre id="out">booting…</pre>
<script type="module">
  import createBeam from './beam.mjs';
  const out = document.getElementById('out');
  const lines = [];
  const expr = new URLSearchParams(location.search).get('eval') ??
    'io:format("hello from ~s, OTP ~s, ~p processes~n", [erlang:system_info(system_architecture), erlang:system_info(otp_release), erlang:system_info(process_count)]), halt().';
  const t0 = performance.now();
  createBeam({
    arguments: ['-S', '1', '-SDcpu', '1', '-A', '0', '--', '-root', '/otp', '-bindir', '/otp/bin',
      '-progname', 'erl', '--', '-home', '/', '-boot', '/otp/bin/start_clean', '-noshell', '-eval', expr],
    preRun: [(m) => Object.assign(m.ENV, { BINDIR: '/otp/bin', ROOTDIR: '/otp', EMU: 'beam', PROGNAME: 'erl' })],
    print: (s) => lines.push(s),
    printErr: (s) => lines.push(s),
    onExit: (code) => {
      out.textContent = lines.join('\n') + `\n[exit status ${code}, ${Math.round(performance.now() - t0)} ms]`;
      document.title = 'done';
    },
  });
</script>
