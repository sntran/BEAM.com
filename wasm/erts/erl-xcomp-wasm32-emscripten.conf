## ERTS for WebAssembly with Emscripten, threads as green threads on JSPI.
erl_xcomp_build=guess
# WASM64=1 in build.sh: wasm64-unknown-emscripten and -sMEMORY64.
erl_xcomp_host=${WASM_TARGET:-wasm32-unknown-emscripten}
# For the search of OpenSSL (crypto).
erl_xcomp_sysroot=${EMSDK:?}/upstream/emscripten/cache/sysroot
erl_xcomp_configure_flags="--disable-jit --without-termcap --with-ssl=${WASM_OPENSSL:?} --disable-dynamic-ssl-lib --enable-static-nifs --enable-builtin-zlib --disable-esock --without-wx --without-odbc --without-javac --without-jinterface --disable-parallel-configure --disable-kernel-poll --disable-security-hardening-flags"
CC=emcc
CXX=em++
AR=emar
RANLIB=emranlib
LD=emcc
# ERTS needs these three (configure adds them with the hardening flags,
# which are off: no stack canaries or fortify checks in WebAssembly).
CFLAGS="-O2 -D_GNU_SOURCE -fno-strict-aliasing -fno-strict-overflow -fno-delete-null-pointer-checks ${WASM_ARCH_FLAGS:-}"
LDFLAGS="${WASM_ARCH_FLAGS:-}"
# The crypto NIF is linked into the emulator, so libcrypto is too.
LIBS="${WASM_OPENSSL}/lib/libcrypto.a"
erl_xcomp_bigendian=no
erl_xcomp_double_middle_endian=no
erl_xcomp_linux_clock_gettime_correction=no
erl_xcomp_linux_nptl=no
erl_xcomp_linux_usable_sigusrx=no
erl_xcomp_linux_usable_sigaltstack=no
erl_xcomp_poll=yes
erl_xcomp_kqueue=no
erl_xcomp_putenv_copy=no
erl_xcomp_reliable_fpe=no
erl_xcomp_getaddrinfo=no
erl_xcomp_gethrvtime_procfs_ioctl=no
erl_xcomp_clock_gettime_cpu_time=no
erl_xcomp_after_morecore_hook=no
erl_xcomp_dlsym_brk_wrappers=no
erl_xcomp_posix_memalign=yes
