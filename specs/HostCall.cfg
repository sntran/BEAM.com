\* The design: no retry at a timeout ("unknown"), and a snapshot only when no
\* caller is between its request and its result. The variants Retry = TRUE,
\* Guard = "inflight" and Guard = "none" break AtMostOnce or WaitHasCall
\* (see the end of the comment of HostCall.tla).
CONSTANTS
    Callers = {c1, c2}
    MaxTries = 2
    Retry = FALSE
    Guard = "all"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AtMostOnce
    OkMeansSent
    FailedMeansNotSent
    WaitHasCall
CHECK_DEADLOCK FALSE
